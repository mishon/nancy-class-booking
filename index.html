<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>課程預約</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: #222;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      padding: 28px 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 32px;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 18px;
      word-break: break-word;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d93025;
    }

    pre {
      margin-top: 20px;
      padding: 16px;
      background: #f1f3f4;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>課程預約</h1>

  <div id="status">
    初始化中...
  </div>

</div>

<script>

  // =========================================================
  // 基本設定
  // =========================================================

  const LIFF_ID = "2011656647-Tw5kY4xl";

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


  // =========================================================
  // 顯示訊息
  // =========================================================

  function setStatus(message, className = "") {

    const status = document.getElementById("status");

    status.className = className;

    status.textContent = message;
  }


  // =========================================================
  // 顯示錯誤
  // =========================================================

  function showError(error) {

    console.error(error);

    let message = "";

    if (error instanceof Error) {
      message = error.message;
    } else {
      message = String(error);
    }

    setStatus(
      "❌ 發生錯誤：\n\n" + message,
      "error"
    );
  }


  // =========================================================
  // GAS JSONP Callback
  // =========================================================
  //
  // GAS 會回傳：
  //
  // gasTestCallback({
  //   success: true,
  //   message: "GAS API 正常",
  //   time: "..."
  // });
  //
  // =========================================================

  window.gasTestCallback = function(result) {

    console.log("GAS 回傳結果：", result);

    if (!result) {

      showError(
        new Error("GAS 回傳空資料")
      );

      return;
    }

    if (result.success) {

      setStatus(
        "⑥ GAS API 呼叫成功！",
        "success"
      );

      const pre = document.createElement("pre");

      pre.textContent =
        JSON.stringify(result, null, 2);

      document.querySelector(".box").appendChild(pre);

    } else {

      showError(
        new Error(
          result.message || "GAS API 回傳失敗"
        )
      );
    }

  };


  // =========================================================
  // 呼叫 GAS API
  // =========================================================

  function callGasApi() {

    setStatus(
      "④ 已取得 ID Token\n\n" +
      "⑤ 呼叫 GAS API..."
    );


    // 避免重複建立 script
    const oldScript =
      document.getElementById("gas-api-script");

    if (oldScript) {
      oldScript.remove();
    }


    const script =
      document.createElement("script");

    script.id = "gas-api-script";


    // JSONP callback
    script.src =
      GAS_URL +
      "?callback=gasTestCallback&_=" +
      Date.now();


    script.onerror = function() {

      showError(
        new Error(
          "GAS API 無法連線。\n\n" +
          "請確認 GAS Web App 部署網址與權限。"
        )
      );

    };


    document.body.appendChild(script);


    // =====================================================
    // Timeout
    // =====================================================

    setTimeout(function() {

      const currentScript =
        document.getElementById("gas-api-script");

      if (currentScript) {

        console.warn(
          "GAS API 等待超過 10 秒"
        );

      }

    }, 10000);

  }


  // =========================================================
  // 初始化 LIFF
  // =========================================================

  async function init() {

    try {

      // -----------------------------------------------------
      // ① 初始化 LIFF
      // -----------------------------------------------------

      setStatus(
        "① 初始化 LIFF..."
      );


      await liff.init({

        liffId: LIFF_ID,

        withLoginOnExternalBrowser: true

      });


      // -----------------------------------------------------
      // ② LIFF 初始化成功
      // -----------------------------------------------------

      setStatus(
        "② LIFF 初始化成功"
      );


      // -----------------------------------------------------
      // ③ 判斷 LINE 登入
      // -----------------------------------------------------

      if (!liff.isLoggedIn()) {

        setStatus(
          "③ 尚未登入 LINE\n\n" +
          "準備登入..."
        );


        liff.login();

        return;
      }


      setStatus(
        "③ LINE 登入成功"
      );


      // -----------------------------------------------------
      // ④ 取得 ID Token
      // -----------------------------------------------------

      const idToken =
        liff.getIDToken();


      if (!idToken) {

        throw new Error(
          "拿不到 LINE ID Token"
        );

      }


      console.log(
        "LINE ID Token 已取得"
      );


      // -----------------------------------------------------
      // ⑤ 呼叫 GAS
      // -----------------------------------------------------

      callGasApi();


    } catch (error) {

      showError(error);

    }

  }


  // =========================================================
  // 開始
  // =========================================================

  init();

</script>

</body>
</html>
