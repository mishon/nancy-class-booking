<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>課程預約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: #222;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      padding: 28px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 18px;
      word-break: break-word;
    }

    pre {
      margin-top: 20px;
      padding: 16px;
      background: #f1f3f4;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>課程預約</h1>

  <div id="status">
    初始化中...
  </div>

</div>

<script>

const LIFF_ID = "2011656647-Tw5kY4xl";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


function setStatus(text) {
  document.getElementById("status").textContent = text;
}


/*
 * ============================================================
 * GAS JSONP Callback
 * ============================================================
 */

window.gasTestCallback = function(result) {

  console.log("========== GAS CALLBACK ==========");
  console.log(result);

  if (!result) {

    setStatus(
      "❌ GAS 回傳空資料"
    );

    return;
  }


  setStatus(
    "⑥ GAS API 呼叫成功！\n\n" +
    JSON.stringify(result, null, 2)
  );

};


/*
 * ============================================================
 * 呼叫 GAS
 * ============================================================
 */

function callGas() {

  setStatus(
    "④ 已取得 ID Token\n\n" +
    "⑤ 正在呼叫 GAS..."
  );


  const script =
    document.createElement("script");


  script.src =
    GAS_URL +
    "?callback=gasTestCallback&x=" +
    Date.now();


  script.onload = function() {

    console.log(
      "GAS script 載入完成"
    );

  };


  script.onerror = function(error) {

    console.error(
      "GAS script 載入失敗",
      error
    );

    setStatus(
      "❌ GAS script 載入失敗"
    );

  };


  document.body.appendChild(script);

}


/*
 * ============================================================
 * LIFF 初始化
 * ============================================================
 */

async function init() {

  try {

    setStatus(
      "① 初始化 LIFF..."
    );


    await liff.init({

      liffId: LIFF_ID,

      withLoginOnExternalBrowser: true

    });


    setStatus(
      "② LIFF 初始化成功"
    );


    if (!liff.isLoggedIn()) {

      setStatus(
        "③ 尚未登入 LINE\n\n" +
        "準備登入..."
      );

      liff.login();

      return;
    }


    setStatus(
      "③ LINE 登入成功"
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "拿不到 LINE ID Token"
      );

    }


    console.log(
      "ID Token 已取得"
    );


    callGas();

  }
  catch (error) {

    console.error(error);

    setStatus(
      "❌ 發生錯誤\n\n" +
      error.message
    );

  }

}


init();

</script>

</body>
</html>
