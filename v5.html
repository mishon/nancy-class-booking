<!-- =====================================================
 LIFF STABLE FINAL
 以 V12 的正常課程取得 / JSONP / UI 為基準。
 不修改通訊核心。
 修正紀錄 2026-09-23：
   - 自己預約（綠框）vs 代訂（橙框）顏色區別
   - confirm/alert 改用自訂 Modal（消除系統對話框 hostname 字樣）
   - updateBottomBar() 合併重複 forEach（效能優化）
   - 移除從未呼叫的 cleanupJsonp() 死碼
   - guest modal 姓名驗證改為 modal 內 inline 錯誤訊息
===================================================== -->

<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Free Life Nancy 的械式皮拉提斯課程預約小工具</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      padding-bottom: 150px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome {
      color: #666;
      margin-bottom: 20px;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status.error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .status.info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }

    .class-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .class-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .class-card.selectable {
      cursor: pointer;
    }

    .class-card.selected {
      border-color: #1a73e8;
      background: #f4f8ff;
    }

    .class-card.full {
      background: #f1f1f1;
      color: #999;
    }

    /* 自己已預約：綠框 */
    .class-card.has-self-booking {
      border-color: #4caf50;
      background: #f5fff6;
    }

    /* 只有代訂（幫朋友預約），自己沒有預約：橙框 */
    .class-card.has-guest-booking {
      border-color: #ff9800;
      background: #fff8f0;
    }

    /* 同時有自己預約和代訂：自己預約（綠）優先 */
    .class-card.has-self-booking.has-guest-booking {
      border-color: #4caf50;
      background: #f5fff6;
    }

    /* 選取覆蓋有預約的顏色 */
    .class-card.selected.has-self-booking,
    .class-card.selected.has-guest-booking {
      border-color: #1a73e8;
      background: #f4f8ff;
    }

    .class-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .class-date {
      font-size: 21px;
      font-weight: 700;
    }

    .class-weekday {
      margin-left: 6px;
      color: #666;
    }

    .class-time {
      margin-top: 6px;
      color: #555;
    }

    .class-count {
      white-space: nowrap;
      font-weight: 600;
    }

    .count-open {
      color: #1a73e8;
    }

    .count-full {
      color: #d32f2f;
    }

    .name-list {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .my-bookings {
      margin-top: 12px;
    }

    .my-booking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }

    .my-booking-name {
      font-size: 14px;
      color: #333;
    }

    .guest-label {
      font-size: 12px;
      color: #e65100;
      margin-left: 5px;
    }

    .cancel-button {
      border: 1px solid #d32f2f;
      background: white;
      color: #d32f2f;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;

      background: rgba(255,255,255,.97);
      border-top: 1px solid #ddd;

      padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));
    }

    .bottom-inner {
      max-width: 600px;
      margin: auto;
    }

    .selected-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .main-button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .main-button.secondary {
      background: #ef6c00;
    }

    .main-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: rgba(255,255,255,.78);
      backdrop-filter: blur(2px);
    }

    .loading-spinner {
      width: 44px;
      height: 44px;

      border: 4px solid #ddd;
      border-top-color: #1a73e8;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 17px;
      font-weight: 600;
      color: #555;
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9000;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.4);

      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;

      background: white;
      border-radius: 16px;

      padding: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .modal-text {
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    /* 自訂確認對話框的訊息，支援多行 */
    .modal-text-pre {
      color: #333;
      line-height: 1.7;
      margin-bottom: 15px;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .guest-input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    .guest-input:focus {
      border-color: #1a73e8;
    }

    /* 輸入框下方的 inline 錯誤訊息 */
    .input-error {
      display: none;
      color: #c62828;
      font-size: 13px;
      margin-top: 6px;
    }

    .input-error.show {
      display: block;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .modal-cancel {
      background: #eee;
      color: #555;
    }

    .modal-confirm {
      background: #1a73e8;
      color: white;
    }

    .modal-confirm.danger {
      background: #d32f2f;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

  </style>

</head>

<body>

  <!-- Loading -->

  <div id="loadingOverlay">

    <div class="loading-spinner"></div>

    <div id="loadingText" class="loading-text">
      載入中，請稍候...
    </div>

  </div>


  <!-- 自訂確認對話框（取代 window.confirm，消除系統對話框的 hostname 字樣） -->

  <div id="confirmModal" class="modal">

    <div class="modal-box">

      <div id="confirmModalTitle" class="modal-title"></div>

      <div id="confirmModalText" class="modal-text-pre"></div>

      <div class="modal-buttons">

        <button
          class="modal-button modal-cancel"
          onclick="rejectConfirm()"
        >
          取消
        </button>

        <button
          id="confirmModalOk"
          class="modal-button modal-confirm"
          onclick="resolveConfirm()"
        >
          確定
        </button>

      </div>

    </div>

  </div>


  <!-- Guest Modal -->

  <div id="guestModal" class="modal">

    <div class="modal-box">

      <div class="modal-title">
        幫朋友預約
      </div>

      <div class="modal-text">
        請輸入實際參加者姓名。
        <br>
        對方不需要登入 LINE，也不需要加入群組。
      </div>

      <input
        id="guestNameInput"
        class="guest-input"
        type="text"
        maxlength="30"
        placeholder="例如：阿華"
      >

      <div id="guestNameError" class="input-error"></div>

      <div class="modal-buttons">

        <button
          class="modal-button modal-cancel"
          onclick="closeGuestModal()"
        >
          取消
        </button>

        <button
          class="modal-button modal-confirm"
          onclick="confirmGuestBooking()"
        >
          確定預約
        </button>

      </div>

    </div>

  </div>


  <!-- Main -->

  <div class="container">

    <div class="title">
      Free Life Nancy 的械式皮拉提斯課程預約小工具
    </div>

    <div id="welcomeText" class="welcome">
      載入中...
    </div>

    <div id="status" class="status"></div>

    <div id="classList" class="class-list">

      <div class="empty">
        載入課程中...
      </div>

    </div>

  </div>


  <!-- Bottom -->

  <div class="bottom-bar">

    <div class="bottom-inner">

      <div
        id="selectedInfo"
        class="selected-info"
      >
        尚未選擇課程
      </div>

      <div class="button-row">

        <button
          id="selfButton"
          class="main-button"
          onclick="submitSelfBookings()"
          disabled
        >
          自己預約
        </button>

        <button
          id="guestButton"
          class="main-button secondary"
          onclick="openGuestModal()"
          disabled
        >
          幫朋友預約
        </button>

      </div>

    </div>

  </div>


  <script>

    const LIFF_ID =
      "2011656647-X8PhmAQI";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


    let idToken = "";

    let classes = [];

    let selectedClassIds = [];

    let isSubmitting = false;


    window.addEventListener(
      "load",
      init
    );


    async function init() {
      const welcome = document.getElementById("welcomeText");

      try {
        welcome.textContent = "V5 正在啟動...";

        showStatus("① 開始初始化 LIFF...", "info");

        const initPromise = liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        const timeoutPromise = new Promise(function(_, reject) {
          setTimeout(function() {
            reject(
              new Error(
                "LIFF 初始化超過 15 秒，可能是 LINE LIFF 初始化沒有完成。"
              )
            );
          }, 15000);
        });

        await Promise.race([
          initPromise,
          timeoutPromise
        ]);

        showStatus("② LIFF 初始化完成", "success");

        console.log("LIFF 初始化完成");
        console.log("LIFF ID:", LIFF_ID);
        console.log("isInClient:", liff.isInClient());
        console.log("isLoggedIn:", liff.isLoggedIn());

        if (!liff.isLoggedIn()) {

          showStatus(
            "③ LINE 尚未登入",
            "error"
          );

          throw new Error(
            "LINE 尚未登入，請重新從 LINE 開啟課程預約。"
          );
        }

        showStatus(
          "③ LINE 登入狀態正常",
          "success"
        );

        idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            "無法取得 LINE ID Token"
          );
        }

        showStatus(
          "④ 已取得 LINE 身分，正在取得課程...",
          "info"
        );

        console.log("已取得 LINE ID Token");

        loadClasses();

      } catch (error) {

        console.error(
          "LIFF 初始化失敗:",
          error
        );

        hideLoading();

        showStatus(
          "❌ " +
          (error.message || String(error)),
          "error"
        );
      }
    }


    function showLoading(message) {

      document
        .getElementById(
          "loadingText"
        )
        .textContent =
          message ||
          "載入中，請稍候...";


      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "flex";
    }


    function hideLoading() {

      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "none";
    }


    function showStatus(
      message,
      type
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.textContent =
        message;

      status.className =
        "status " +
        (type || "info");
    }


    /*
     * ============================================================
     * 自訂確認對話框
     *
     * 取代 window.confirm()，避免系統對話框顯示 hostname 字樣。
     * ============================================================
     */

    let _confirmCallback = null;


    function showConfirm(title, message, onConfirm, onCancel, isDanger) {

      document.getElementById("confirmModalTitle").textContent =
        title || "確認";

      document.getElementById("confirmModalText").textContent =
        message || "";

      const okBtn = document.getElementById("confirmModalOk");
      okBtn.className = "modal-button modal-confirm" +
        (isDanger ? " danger" : "");

      _confirmCallback = {
        onConfirm: onConfirm || null,
        onCancel: onCancel || null
      };

      document.getElementById("confirmModal").style.display = "flex";
    }


    function resolveConfirm() {
      document.getElementById("confirmModal").style.display = "none";
      const cb = _confirmCallback;
      _confirmCallback = null;
      if (cb && cb.onConfirm) cb.onConfirm();
    }


    function rejectConfirm() {
      document.getElementById("confirmModal").style.display = "none";
      const cb = _confirmCallback;
      _confirmCallback = null;
      if (cb && cb.onCancel) cb.onCancel();
    }


    /*
     * ============================================================
     * V5 API / 畫面同步核心
     *
     * 原則：
     * 1. 預約、代訂、取消都只送一次後端操作。
     * 2. 正常收到 JSONP callback：立即更新畫面。
     * 3. 如果後端已寫入，但 JSONP callback 沒回來：
     *    短時間後改用「重新讀取課程」確認結果。
     * 4. 不使用 8 秒長時間 loading。
     * 5. 所有操作共用同一套處理流程，避免一個一個補。
     * ============================================================
     */

    function applyBookingData(data) {

      if (!data) {
        throw new Error(
          "沒有取得課程資料"
        );
      }


      classes =
        data.classes || [];


      if (data.userName) {

        document
          .getElementById(
            "welcomeText"
          )
          .textContent =
            data.userName +
            "，您好";

      }


      renderClasses();

      updateBottomBar();
    }


    /*
     * ------------------------------------------------------------
     * 一般取得課程
     * ------------------------------------------------------------
     */

    function loadClasses() {

      showLoading(
        "正在取得課程資料，請稍候..."
      );


      fetchBookingData(
        function(data) {

          selectedClassIds = [];

          applyBookingData(data);

          hideLoading();

        },
        function(error) {

          hideLoading();

          console.error(error);

          showStatus(
            error.message ||
            "取得課程失敗",
            "error"
          );

        }
      );
    }


    /*
     * ------------------------------------------------------------
     * 靜默重新取得課程
     *
     * 不顯示 loading。
     * 給「預約成功但 callback 沒回來」時使用。
     * ------------------------------------------------------------
     */

    function refreshClassesSilently(
      success,
      failure
    ) {

      fetchBookingData(
        function(data) {

          try {

            applyBookingData(data);

            if (success) {
              success(data);
            }

          } catch (error) {

            if (failure) {
              failure(error);
            }

          }

        },
        function(error) {

          if (failure) {
            failure(error);
          }

        }
      );
    }


    /*
     * ------------------------------------------------------------
     * 讀取課程 API
     * ------------------------------------------------------------
     */

    function fetchBookingData(success, failure) {

      /*
       * LIFF / GAS 使用 JSONP。
       * 手機版 LINE 內建瀏覽器偶爾會第一次 script request 失敗，
       * 因此只在「讀取課程」失敗時自動重試一次。
       * 單次最多等待 6 秒，避免畫面長時間卡住。
       */

      let attempt = 0;
      let finished = false;
      let timer = null;
      let script = null;
      let callbackName = null;

      function cleanup() {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }

        if (callbackName) {
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }
        }

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        script = null;
        callbackName = null;
      }

      function fail(error) {
        if (finished) return;
        finished = true;
        cleanup();
        if (failure) failure(error);
      }

      function request() {
        if (finished) return;

        attempt++;

        callbackName =
          "gasBookingCallback_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 100000);

        script = document.createElement("script");

        window[callbackName] = function(response) {
          if (finished) return;

          try {
            if (!response) {
              throw new Error("GAS 沒有回傳資料");
            }

            if (!response.success) {
              throw new Error(
                response.message || "取得課程失敗"
              );
            }

            const data = response.data;

            finished = true;
            cleanup();

            if (success) success(data);

          } catch (error) {
            fail(error);
          }
        };

        script.onerror = function() {
          if (finished) return;

          cleanup();

          if (attempt < 2) {
            setTimeout(request, 350);
            return;
          }

          fail(
            new Error(
              "目前無法取得課程資料，請重新開啟課程預約。"
            )
          );
        };

        script.src =
          GAS_URL +
          "?callback=" + encodeURIComponent(callbackName) +
          "&idToken=" + encodeURIComponent(idToken) +
          "&_t=" + Date.now();

        document.body.appendChild(script);

        timer = setTimeout(function() {
          if (finished) return;

          cleanup();

          if (attempt < 2) {
            setTimeout(request, 350);
            return;
          }

          fail(
            new Error(
              "取得課程資料逾時，請重新開啟課程預約。"
            )
          );
        }, 6000);
      }

      request();
    }

    /*
     * ------------------------------------------------------------
     * 課程卡片
     * ------------------------------------------------------------
     */

    function renderClasses() {

      const container =
        document.getElementById(
          "classList"
        );


      container.innerHTML = "";


      if (!classes.length) {

        container.innerHTML =
          '<div class="empty">' +
          "目前沒有課程" +
          "</div>";

        return;
      }


      classes.forEach(
        function(cls) {

          container.appendChild(
            createClassCard(cls)
          );

        }
      );
    }


    function createClassCard(cls) {

      const card =
        document.createElement(
          "div"
        );


      const isFull =
        Number(cls.count) >=
        Number(cls.maxPeople);


      const myBookings =
        cls.myBookings || [];


      /*
       * 區分自己預約 vs 代訂：
       *   hasSelfBooking：myBookings 中有 isGuest=false 的項目
       *   hasGuestBooking：myBookings 中有 isGuest=true 的項目
       *
       * 顏色邏輯：
       *   只有自己預約 → 綠框
       *   只有代訂     → 橙框
       *   兩者都有     → 綠框優先（代表本人也出席）
       */
      const hasSelfBooking =
        myBookings.some(function(b) { return !b.isGuest; }) ||
        (cls.bookedByMe === true && myBookings.length === 0);

      const hasGuestBooking =
        myBookings.some(function(b) { return b.isGuest; });


      const selected =
        selectedClassIds.includes(
          cls.classId
        );


      let cardClass =
        "class-card";


      if (selected) {

        cardClass +=
          " selected";

      }


      if (hasSelfBooking) {

        cardClass +=
          " has-self-booking";

      }


      if (hasGuestBooking) {

        cardClass +=
          " has-guest-booking";

      }


      if (isFull) {

        cardClass +=
          " full";

      } else {

        /*
         * 只要沒有滿：
         *
         * 1. 尚未預約 → 可以自己預約
         * 2. 已自己預約 → 可以幫朋友預約
         */

        cardClass +=
          " selectable";

      }


      card.className =
        cardClass;


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "class-header";


      const left =
        document.createElement(
          "div"
        );


      const date =
        document.createElement(
          "span"
        );

      date.className =
        "class-date";

      date.textContent =
        cls.date;


      const weekday =
        document.createElement(
          "span"
        );

      weekday.className =
        "class-weekday";

      weekday.textContent =
        "星期" +
        cls.weekday;


      left.appendChild(date);

      left.appendChild(weekday);


      const count =
        document.createElement(
          "div"
        );

      count.className =
        "class-count " +
        (
          isFull
            ? "count-full"
            : "count-open"
        );


      count.textContent =
        cls.count +
        " / " +
        cls.maxPeople;


      header.appendChild(left);

      header.appendChild(count);

      card.appendChild(header);


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "class-time";

      time.textContent =
        "上課時間：" +
        cls.time;


      card.appendChild(time);


      /*
       * 所有參加者
       */

      if (
        cls.names &&
        cls.names.length
      ) {

        const names =
          document.createElement(
            "div"
          );

        names.className =
          "name-list";

        names.textContent =
          "目前預約：" +
          cls.names.join("、");


        card.appendChild(names);

      }


      /*
       * 我的預約
       *
       * myBookings 由 GAS 提供：
       *
       * 自己預約：
       *   isGuest = false
       *
       * 幫朋友預約：
       *   isGuest = true
       */

      if (
        myBookings.length
      ) {

        const myBox =
          document.createElement(
            "div"
          );

        myBox.className =
          "my-bookings";


        myBookings.forEach(
          function(booking) {

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "my-booking-item";


            const name =
              document.createElement(
                "div"
              );

            name.className =
              "my-booking-name";


            name.textContent =
              booking.name ||
              "我的預約";


            if (
              booking.isGuest
            ) {

              const label =
                document.createElement(
                  "span"
                );

              label.className =
                "guest-label";

              label.textContent =
                "（代訂）";


              name.appendChild(
                label
              );

            }


            const cancel =
              document.createElement(
                "button"
              );

            cancel.className =
              "cancel-button";

            cancel.textContent =
              "取消";


            cancel.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();


                if (
                  booking.bookingId
                ) {

                  cancelBookingById(
                    booking.bookingId,
                    cls.date,
                    cls.time,
                    booking.name ||
                    "我的預約"
                  );

                } else {

                  /*
                   * 舊資料若沒有 bookingId，
                   * 自己的預約仍可用 classId 取消。
                   */

                  cancelMyClassBooking(
                    cls.classId,
                    cls.date,
                    cls.time,
                    booking.name ||
                    "我的預約"
                  );

                }

              }
            );


            item.appendChild(name);

            item.appendChild(cancel);

            myBox.appendChild(item);

          }
        );


        card.appendChild(myBox);

      }


      /*
       * 課程選擇
       *
       * 只要未滿，都可以選。
       *
       * 已經自己預約：
       *   可以選來幫朋友預約。
       */

      if (!isFull) {

        card.addEventListener(
          "click",
          function(event) {

            if (isSubmitting) {
              return;
            }


            if (
              event.target &&
              event.target.closest &&
              event.target.closest(
                ".cancel-button"
              )
            ) {

              return;

            }


            toggleSelection(
              cls.classId
            );

          }
        );

      }


      return card;
    }


    function toggleSelection(
      classId
    ) {

      if (isSubmitting) {
        return;
      }


      const index =
        selectedClassIds.indexOf(
          classId
        );


      if (index >= 0) {

        selectedClassIds.splice(
          index,
          1
        );

      } else {

        selectedClassIds.push(
          classId
        );

      }


      renderClasses();

      updateBottomBar();
    }


    function updateBottomBar() {

      const count =
        selectedClassIds.length;


      document
        .getElementById(
          "selectedInfo"
        )
        .textContent =
          count
            ? "已選擇 " +
              count +
              " 堂課程"
            : "尚未選擇課程";


      /*
       * [效能優化] 原本兩個分開的 forEach 各自查詢 classes.find()，
       * 合併成一個迴圈同時計算 canSelfBook 和 canGuestBook。
       */

      let canSelfBook = count > 0;
      let canGuestBook = count > 0;


      selectedClassIds.forEach(
        function(classId) {

          const cls =
            classes.find(
              function(item) {
                return String(item.classId) === String(classId);
              }
            );


          if (!cls) {
            return;
          }


          const myBookings =
            cls.myBookings || [];

          const hasMyBooking =
            myBookings.length > 0 ||
            cls.bookedByMe === true;

          /*
           * 已預約的課程不能再自己預約。
           */
          if (hasMyBooking) {
            canSelfBook = false;
          }

          /*
           * 已滿的課程不能代訂。
           */
          if (
            Number(cls.count) >=
            Number(cls.maxPeople)
          ) {
            canGuestBook = false;
          }

        }
      );


      document
        .getElementById(
          "selfButton"
        )
        .disabled =
          count === 0 ||
          isSubmitting ||
          !canSelfBook;


      document
        .getElementById(
          "guestButton"
        )
        .disabled =
          count === 0 ||
          isSubmitting ||
          !canGuestBook;

    }


    /*
     * ============================================================
     * 共用：送出後如果 callback 沒回來，
     *       用最新課程資料確認結果。
     *
     * fallbackDelay = 6000ms
     * ============================================================
     */

    function runBookingAction(
      action,
      params,
      loadingMessage,
      successMessage,
      successMessageFunction
    ) {

      if (isSubmitting) return;

      isSubmitting = true;
      showLoading(loadingMessage);
      updateBottomBar();

      const callbackName =
        "gasActionCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;
      let timeoutTimer = null;
      let refreshStarted = false;

      function cleanup() {
        if (timeoutTimer) {
          clearTimeout(timeoutTimer);
          timeoutTimer = null;
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      function finish() {
        if (finished) return;
        finished = true;
        cleanup();
        isSubmitting = false;
        hideLoading();
        updateBottomBar();
      }

      function showSuccess(data) {
        if (successMessageFunction) {
          try {
            showStatus(
              successMessageFunction(data || {}),
              "success"
            );
            return;
          } catch (e) {
            console.error(e);
          }
        }

        showStatus(
          successMessage || "操作完成",
          "success"
        );
      }

      /*
       * 先顯示成功並解除 Loading，再背景更新課程。
       * 背景更新失敗不覆蓋已成功結果。
       */
      function refreshInBackground() {
        if (refreshStarted) return;
        refreshStarted = true;

        setTimeout(function() {
          refreshClassesSilently(
            function(latestData) {
              if (finished) {
                applyBookingData(latestData);
              }
            },
            function(error) {
              console.warn(
                "背景更新課程失敗，不影響已完成的操作：",
                error
              );
            }
          );
        }, 200);
      }

      window[callbackName] = function(response) {
        if (finished) return;

        try {
          if (!response) {
            throw new Error("GAS 沒有回傳資料");
          }

          if (!response.success) {
            throw new Error(
              response.message || "操作失敗"
            );
          }

          const data = response.data || {};

          // 後端已回傳最新課程資料，直接更新畫面
          if (data.classes && Array.isArray(data.classes)) {
            applyBookingData(data);
          }

          showSuccess(data);
          finish();
          selectedClassIds = [];
          updateBottomBar();

          refreshInBackground();

        } catch (error) {
          console.error(error);
          finish();
          showStatus(
            error.message || "操作失敗",
            "error"
          );
        }
      };

      /*
       * mutation 的 JSONP 如果沒有 callback，
       * 不能直接重送 mutation，否則可能造成重複預約。
       * 只做一次「讀取課程」確認。
       */
      function confirmUnknownResult() {
        if (finished) return;

        finished = true;
        cleanup();
        isSubmitting = false;
        hideLoading();
        updateBottomBar();

        refreshClassesSilently(
          function(latestData) {
            selectedClassIds = [];
            applyBookingData(latestData);
            showStatus(
              "系統已重新整理課程資料，請確認最新狀態。",
              "info"
            );
          },
          function(error) {
            console.error(
              "操作結果確認失敗：",
              error
            );
            showStatus(
              "目前無法確認操作結果，請重新開啟課程預約確認；請勿連續重複送出。",
              "error"
            );
          }
        );
      }

      script.onerror = function() {
        confirmUnknownResult();
      };

      let url =
        GAS_URL +
        "?callback=" + encodeURIComponent(callbackName) +
        "&action=" + encodeURIComponent(action) +
        "&idToken=" + encodeURIComponent(idToken) +
        "&_t=" + Date.now();

      Object.keys(params || {}).forEach(function(key) {
        url +=
          "&" +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(params[key]);
      });

      script.src = url;
      document.body.appendChild(script);

      // 最多等待 6 秒；超時只做一次讀取確認，絕不重送 mutation
      timeoutTimer = setTimeout(function() {
        if (!finished) {
          confirmUnknownResult();
        }
      }, 6000);
    }

    /*
     * ==========================
     * 自己預約
     * ==========================
     */

    function submitSelfBookings() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {

        return;
      }


      const ids =
        selectedClassIds.slice();


      showConfirm(
        "確認預約",
        "確定要預約所選的 " + ids.length + " 堂課嗎？",
        function() {

          runBookingAction(
            "submitBookings",
            {
              selectedClassIds:
                JSON.stringify(ids)
            },
            "預約處理中，請稍候...",
            "預約完成"
          );

        }
      );
    }


    /*
     * ==========================
     * Guest Modal
     * ==========================
     */

    function openGuestModal() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {

        return;
      }


      document
        .getElementById(
          "guestNameInput"
        )
        .value = "";

      // 清除上次的 inline 錯誤訊息
      const errorEl = document.getElementById("guestNameError");
      errorEl.textContent = "";
      errorEl.className = "input-error";

      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "flex";


      setTimeout(
        function() {

          document
            .getElementById(
              "guestNameInput"
            )
            .focus();

        },
        100
      );
    }


    function closeGuestModal() {

      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "none";
    }


    /*
     * ==========================
     * 幫朋友預約
     * ==========================
     */

    function confirmGuestBooking() {

      if (isSubmitting) {
        return;
      }


      const guestName =
        document
          .getElementById(
            "guestNameInput"
          )
          .value
          .trim();

      const errorEl = document.getElementById("guestNameError");


      // 姓名驗證改為 modal 內 inline 錯誤，不用系統 alert()
      if (!guestName) {

        errorEl.textContent = "請輸入參加者姓名";
        errorEl.className = "input-error show";

        document
          .getElementById("guestNameInput")
          .focus();

        return;
      }


      if (
        guestName.length > 30
      ) {

        errorEl.textContent = "姓名最多 30 個字";
        errorEl.className = "input-error show";

        return;
      }


      errorEl.className = "input-error";


      if (
        !selectedClassIds.length
      ) {

        return;
      }


      // =====================================================
      // 送出前重新整理選擇清單
      // =====================================================
      const ids = Array.from(
        new Set(
          selectedClassIds.map(function(id) {
            return String(id);
          })
        )
      );

      if (!ids.length) {
        showStatus("沒有選擇任何課程", "error");
        closeGuestModal();
        return;
      }

      // =====================================================
      // 把「實際準備送給 GAS 的日期」顯示給使用者確認
      // =====================================================
      const selectedDateTexts = ids
        .map(function(classId) {
          const cls = classes.find(function(item) {
            return String(item.classId) === String(classId);
          });

          if (!cls) {
            return "未知課程(" + classId + ")";
          }

          return (
            cls.date +
            "（" +
            cls.weekday +
            "） " +
            cls.time
          );
        });

      console.log(
        "【幫朋友預約】實際送出 selectedClassIds =",
        ids
      );

      console.log(
        "【幫朋友預約】實際送出課程 =",
        selectedDateTexts
      );

      const confirmMessage =
        "確定要幫「" +
        guestName +
        "」預約以下 " +
        ids.length +
        " 堂課嗎？\n\n" +
        selectedDateTexts.join("\n");

      // 先關 guest modal，再開確認 modal
      closeGuestModal();

      showConfirm(
        "確認代訂",
        confirmMessage,
        function() {

          runBookingAction(
            "submitGuestBookings",
            {
              guestName:
                guestName,

              selectedClassIds:
                JSON.stringify(ids)
            },
            "正在幫「" +
            guestName +
            "」預約，請稍候...",
            "代訂完成",
            function(data) {

              console.log(
                "【幫朋友預約】GAS 實際處理 requestedClassIds =",
                data.requestedClassIds || []
              );

              console.log(
                "【幫朋友預約】GAS results =",
                data.results || []
              );

              const successCount =
                (data.results || [])
                  .filter(
                    function(r) {
                      return r.success;
                    }
                  )
                  .length;


              const successDates =
                (data.results || [])
                  .filter(function(r) {
                    return r.success;
                  })
                  .map(function(r) {
                    const cls =
                      classes.find(function(item) {
                        return String(item.classId) ===
                          String(r.classId);
                      });

                    return cls
                      ? cls.date + "（" + cls.weekday + "）"
                      : String(r.classId);
                  });

              if (successCount === 0) {
                return (
                  "「" +
                  guestName +
                  "」沒有新增成功的代訂課程"
                );
              }

              return (
                "已幫「" +
                guestName +
                "」預約 " +
                successCount +
                " 堂課：\n" +
                successDates.join("、")
              );

            }
          );

        }
      );
    }


    /*
     * ==========================
     * 取消：共用
     * ==========================
     */

    function cancelBookingById(
      bookingId,
      date,
      time,
      name
    ) {

      if (isSubmitting) {
        return;
      }


      showConfirm(
        "確認取消",
        "確定要取消「" +
        name +
        "」在 " +
        date +
        " " +
        time +
        " 的預約嗎？",
        function() {

          runBookingAction(
            "cancelBookingById",
            {
              bookingId:
                bookingId
            },
            "取消預約處理中，請稍候...",
            "已取消「" +
            name +
            "」的預約"
          );

        },
        null,
        true  // isDanger → 紅色確定按鈕
      );
    }


    /*
     * 舊資料沒有 bookingId 時，
     * 自己的預約仍可透過 classId 取消。
     */

    function cancelMyClassBooking(
      classId,
      date,
      time,
      name
    ) {

      if (isSubmitting) {
        return;
      }


      showConfirm(
        "確認取消",
        "確定要取消「" +
        name +
        "」在 " +
        date +
        " " +
        time +
        " 的預約嗎？",
        function() {

          runBookingAction(
            "cancelBooking",
            {
              classId:
                classId
            },
            "取消預約處理中，請稍候...",
            "已取消「" +
            name +
            "」的預約"
          );

        },
        null,
        true  // isDanger → 紅色確定按鈕
      );
    }

  </script>
