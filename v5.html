<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Free Life Nancy的械式皮拉提斯課程預約小工具</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      padding-bottom: 150px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome {
      color: #666;
      margin-bottom: 20px;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status.error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .status.info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }

    .class-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .class-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .class-card.selectable {
      cursor: pointer;
    }

    .class-card.selected {
      border-color: #1a73e8;
      background: #f4f8ff;
    }

    .class-card.full {
      background: #f1f1f1;
      color: #999;
    }

    .class-card.has-my-booking {
      border-color: #4caf50;
      background: #f5fff6;
    }

    /* V7：如果同時「已經有我的預約」又被選取，
       選取狀態必須優先顯示藍色，避免使用者看不出自己選了哪堂。 */
    .class-card.selected.has-my-booking {
      border-color: #1a73e8;
      background: #f4f8ff;
    }

    .class-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .class-date {
      font-size: 21px;
      font-weight: 700;
    }

    .class-weekday {
      margin-left: 6px;
      color: #666;
    }

    .class-time {
      margin-top: 6px;
      color: #555;
    }

    .class-count {
      white-space: nowrap;
      font-weight: 600;
    }

    .count-open {
      color: #1a73e8;
    }

    .count-full {
      color: #d32f2f;
    }

    .name-list {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .my-bookings {
      margin-top: 12px;
    }

    .my-booking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }

    .my-booking-name {
      font-size: 14px;
      color: #333;
    }

    .guest-label {
      font-size: 12px;
      color: #1565c0;
      margin-left: 5px;
    }

    .cancel-button {
      border: 1px solid #d32f2f;
      background: white;
      color: #d32f2f;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;

      background: rgba(255,255,255,.97);
      border-top: 1px solid #ddd;

      padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));
    }

    .bottom-inner {
      max-width: 600px;
      margin: auto;
    }

    .selected-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .main-button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .main-button.secondary {
      background: #4caf50;
    }

    .main-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: rgba(255,255,255,.78);
      backdrop-filter: blur(2px);
    }

    .loading-spinner {
      width: 44px;
      height: 44px;

      border: 4px solid #ddd;
      border-top-color: #1a73e8;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 17px;
      font-weight: 600;
      color: #555;
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9000;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.4);

      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;

      background: white;
      border-radius: 16px;

      padding: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .modal-text {
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .guest-input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    .guest-input:focus {
      border-color: #1a73e8;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .modal-cancel {
      background: #eee;
      color: #555;
    }

    .modal-confirm {
      background: #1a73e8;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

  </style>

</head>

<body>

  <!-- Loading -->

  <div id="loadingOverlay">

    <div class="loading-spinner"></div>

    <div id="loadingText" class="loading-text">
      載入中，請稍候...
    </div>

  </div>


  <!-- Guest Modal -->

  <div id="guestModal" class="modal">

    <div class="modal-box">

      <div class="modal-title">
        幫朋友預約
      </div>

      <div class="modal-text">
        請輸入實際參加者姓名。
        <br>
        對方不需要登入 LINE，也不需要加入群組。
      </div>

      <input
        id="guestNameInput"
        class="guest-input"
        type="text"
        maxlength="30"
        placeholder="例如：阿華"
      >

      <div class="modal-buttons">

        <button
          class="modal-button modal-cancel"
          onclick="closeGuestModal()"
        >
          取消
        </button>

        <button
          class="modal-button modal-confirm"
          onclick="confirmGuestBooking()"
        >
          確定預約
        </button>

      </div>

    </div>

  </div>


  <!-- Main -->

  <div class="container">

    <div class="title">
      Free Life Nancy的械式皮拉提斯課程預約小工具
    </div>

    <div id="welcomeText" class="welcome">
      載入中...
    </div>

    <div id="status" class="status"></div>

    <div id="classList" class="class-list">

      <div class="empty">
        載入課程中...
      </div>

    </div>

  </div>


  <!-- Bottom -->

  <div class="bottom-bar">

    <div class="bottom-inner">

      <div
        id="selectedInfo"
        class="selected-info"
      >
        尚未選擇課程
      </div>

      <div class="button-row">

        <button
          id="selfButton"
          class="main-button"
          onclick="submitSelfBookings()"
          disabled
        >
          自己預約
        </button>

        <button
          id="guestButton"
          class="main-button secondary"
          onclick="openGuestModal()"
          disabled
        >
          幫朋友預約
        </button>

      </div>

    </div>

  </div>


  <script>

    const LIFF_ID =
      "2011656647-X8PhmAQI";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


    let idToken = "";

    let classes = [];

    let selectedClassIds = [];

    let isSubmitting = false;


    window.addEventListener(
      "load",
      init
    );


    async function init() {
  const status = document.getElementById("status");
  const welcome = document.getElementById("welcomeText");

  try {
    // 先確定 HTML / JavaScript 本身有正常執行
    welcome.textContent = "V5 正在啟動...";

    showStatus("① 開始初始化 LIFF...", "info");

    // 防止 liff.init() 無限卡住
    const initPromise = liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    const timeoutPromise = new Promise(function(_, reject) {
      setTimeout(function() {
        reject(
          new Error(
            "LIFF 初始化超過 15 秒，可能是 LINE LIFF 初始化沒有完成。"
          )
        );
      }, 15000);
    });

    await Promise.race([
      initPromise,
      timeoutPromise
    ]);

    showStatus("② LIFF 初始化完成", "success");

    console.log("LIFF 初始化完成");
    console.log("LIFF ID:", LIFF_ID);
    console.log("isInClient:", liff.isInClient());
    console.log("isLoggedIn:", liff.isLoggedIn());

    if (!liff.isLoggedIn()) {

      showStatus(
        "③ LINE 尚未登入",
        "error"
      );

      throw new Error(
        "LINE 尚未登入，請重新從 LINE 開啟課程預約。"
      );
    }

    showStatus(
      "③ LINE 登入狀態正常",
      "success"
    );

    idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error(
        "無法取得 LINE ID Token"
      );
    }

    showStatus(
      "④ 已取得 LINE 身分，正在取得課程...",
      "info"
    );

    console.log("已取得 LINE ID Token");

    loadClasses();

  } catch (error) {

    console.error(
      "LIFF 初始化失敗:",
      error
    );

    hideLoading();

    showStatus(
      "❌ " +
      (error.message || String(error)),
      "error"
    );
  }
}


    function showLoading(message) {

      document
        .getElementById(
          "loadingText"
        )
        .textContent =
          message ||
          "載入中，請稍候...";


      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "flex";
    }


    function hideLoading() {

      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "none";
    }


    function showStatus(
      message,
      type
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.textContent =
        message;

      status.className =
        "status " +
        (type || "info");
    }


    /*
     * ============================================================
     * V5 API / 畫面同步核心
     *
     * 原則：
     * 1. 預約、代訂、取消都只送一次後端操作。
     * 2. 正常收到 JSONP callback：立即更新畫面。
     * 3. 如果後端已寫入，但 JSONP callback 沒回來：
     *    短時間後改用「重新讀取課程」確認結果。
     * 4. 不使用 8 秒長時間 loading。
     * 5. 所有操作共用同一套處理流程，避免一個一個補。
     * ============================================================
     */

    function applyBookingData(data) {

      if (!data) {
        throw new Error(
          "沒有取得課程資料"
        );
      }


      classes =
        data.classes || [];


      if (data.userName) {

        document
          .getElementById(
            "welcomeText"
          )
          .textContent =
            data.userName +
            "，您好";

      }


      renderClasses();

      updateBottomBar();
    }


    /*
     * ------------------------------------------------------------
     * 一般取得課程
     * ------------------------------------------------------------
     */

    function loadClasses() {

      showLoading(
        "正在取得課程資料，請稍候..."
      );


      fetchBookingData(
        function(data) {

          selectedClassIds = [];

          applyBookingData(data);

          hideLoading();

        },
        function(error) {

          hideLoading();

          console.error(error);

          showStatus(
            error.message ||
            "取得課程失敗",
            "error"
          );

        }
      );
    }


    /*
     * ------------------------------------------------------------
     * 靜默重新取得課程
     *
     * 不顯示 loading。
     * 給「預約成功但 callback 沒回來」時使用。
     * ------------------------------------------------------------
     */

    function refreshClassesSilently(
      success,
      failure
    ) {

      fetchBookingData(
        function(data) {

          try {

            applyBookingData(data);

            if (success) {
              success(data);
            }

          } catch (error) {

            if (failure) {
              failure(error);
            }

          }

        },
        function(error) {

          if (failure) {
            failure(error);
          }

        }
      );
    }


    /*
     * ------------------------------------------------------------
     * 讀取課程 API
     * ------------------------------------------------------------
     */

    function fetchBookingData(
      success,
      failure
    ) {

      const callbackName =
        "gasBookingCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        cleanupJsonp(
          callbackName,
          script
        );
      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {

              throw new Error(
                "GAS 沒有回傳資料"
              );

            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "取得課程失敗"
              );

            }


            const data =
              response.data;


            finish();


            if (success) {
              success(data);
            }


          } catch (error) {

            finish();


            if (failure) {
              failure(error);
            }

          }

        };


      script.onerror =
        function() {

          finish();

          if (failure) {

            failure(
              new Error(
                "無法連線到預約系統。"
              )
            );

          }

        };


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&_t=" +
        Date.now();


      document.body.appendChild(
        script
      );
    }


    /*
     * ------------------------------------------------------------
     * 課程卡片
     * ------------------------------------------------------------
     */

    function renderClasses() {

      const container =
        document.getElementById(
          "classList"
        );


      container.innerHTML = "";


      if (!classes.length) {

        container.innerHTML =
          '<div class="empty">' +
          "目前沒有課程" +
          "</div>";

        return;
      }


      classes.forEach(
        function(cls) {

          container.appendChild(
            createClassCard(cls)
          );

        }
      );
    }


    function createClassCard(cls) {

      const card =
        document.createElement(
          "div"
        );


      const isFull =
        Number(cls.count) >=
        Number(cls.maxPeople);


      const myBookings =
        cls.myBookings || [];


      const hasMyBooking =
        myBookings.length > 0 ||
        cls.bookedByMe === true;


      const selected =
        selectedClassIds.some(function(id) {
          return String(id) === String(cls.classId);
        });


      let cardClass =
        "class-card";


      if (selected) {

        cardClass +=
          " selected";

      }


      if (hasMyBooking) {

        cardClass +=
          " has-my-booking";

      }


      if (isFull) {

        cardClass +=
          " full";

      } else {

        /*
         * 只要沒有滿：
         *
         * 1. 尚未預約 → 可以自己預約
         * 2. 已自己預約 → 可以幫朋友預約
         */

        cardClass +=
          " selectable";

      }


      card.className =
        cardClass;


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "class-header";


      const left =
        document.createElement(
          "div"
        );


      const date =
        document.createElement(
          "span"
        );

      date.className =
        "class-date";

      date.textContent =
        cls.date;


      const weekday =
        document.createElement(
          "span"
        );

      weekday.className =
        "class-weekday";

      weekday.textContent =
        "星期" +
        cls.weekday;


      left.appendChild(date);

      left.appendChild(weekday);


      const count =
        document.createElement(
          "div"
        );

      count.className =
        "class-count " +
        (
          isFull
            ? "count-full"
            : "count-open"
        );


      count.textContent =
        cls.count +
        " / " +
        cls.maxPeople;


      header.appendChild(left);

      header.appendChild(count);

      card.appendChild(header);


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "class-time";

      time.textContent =
        "上課時間：" +
        cls.time;


      card.appendChild(time);


      /*
       * 所有參加者
       */

      if (
        cls.names &&
        cls.names.length
      ) {

        const names =
          document.createElement(
            "div"
          );

        names.className =
          "name-list";

        names.textContent =
          "目前預約：" +
          cls.names.join("、");


        card.appendChild(names);

      }


      /*
       * 我的預約
       *
       * myBookings 由 GAS 提供：
       *
       * 自己預約：
       *   isGuest = false
       *
       * 幫朋友預約：
       *   isGuest = true
       */

      if (
        myBookings.length
      ) {

        const myBox =
          document.createElement(
            "div"
          );

        myBox.className =
          "my-bookings";


        myBookings.forEach(
          function(booking) {

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "my-booking-item";


            const name =
              document.createElement(
                "div"
              );

            name.className =
              "my-booking-name";


            name.textContent =
              booking.name ||
              "我的預約";


            if (
              booking.isOffline
            ) {

              const label =
                document.createElement(
                  "span"
                );

              label.className =
                "guest-label";

              label.textContent =
                "（線下登記）";

              name.appendChild(
                label
              );

            } else if (
              booking.isGuest
            ) {

              const label =
                document.createElement(
                  "span"
                );

              label.className =
                "guest-label";

              label.textContent =
                "（代訂）";

              name.appendChild(
                label
              );

            }


            // 線下登記仍算會員本人的預約。
            // 顯示「線下登記」，但本人仍然可以取消。
            const cancel =
              document.createElement(
                "button"
              );

            cancel.className =
              "cancel-button";

            cancel.textContent =
              "取消";


            cancel.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();


                if (
                  booking.bookingId
                ) {

                  cancelBookingById(
                    booking.bookingId,
                    cls.date,
                    cls.time,
                    booking.name ||
                    "我的預約"
                  );

                } else {

                  /*
                   * 舊資料若沒有 bookingId，
                   * 自己的預約仍可用 classId 取消。
                   */

                  cancelMyClassBooking(
                    cls.classId,
                    cls.date,
                    cls.time,
                    booking.name ||
                    "我的預約"
                  );

                }

              }
            );


            item.appendChild(name);

            item.appendChild(cancel);

            myBox.appendChild(item);

          }
        );


        card.appendChild(myBox);

      }


      /*
       * 課程選擇
       *
       * 只要未滿，都可以選。
       *
       * 已經自己預約：
       *   可以選來幫朋友預約。
       */

      if (!isFull) {

        card.addEventListener(
          "click",
          function(event) {

            if (isSubmitting) {
              return;
            }


            if (
              event.target &&
              event.target.closest &&
              event.target.closest(
                ".cancel-button"
              )
            ) {

              return;

            }


            toggleSelection(
              cls.classId
            );

          }
        );

      }


      return card;
    }


    function toggleSelection(
      classId
    ) {

      if (isSubmitting) {
        return;
      }

      // 所有 classId 統一成 String，避免
      // Number("20261014") 與 "20261014" 混用造成選取狀態不同步。
      const normalizedId =
        String(classId);

      const index =
        selectedClassIds.findIndex(
          function(id) {
            return String(id) === normalizedId;
          }
        );

      if (index >= 0) {

        selectedClassIds.splice(
          index,
          1
        );

      } else {

        selectedClassIds.push(
          normalizedId
        );

      }

      console.log(
        "【選取課程】selectedClassIds =",
        selectedClassIds.slice()
      );

      renderClasses();

      updateBottomBar();
    }


    function updateBottomBar() {

      const count =
        selectedClassIds.length;


      document
        .getElementById(
          "selectedInfo"
        )
        .textContent =
          count
            ? "已選擇 " +
              count +
              " 堂課程"
            : "尚未選擇課程";


      /*
       * 自己預約：
       *
       * 選到任何「已經是自己的課程」
       * 就不能按自己預約。
       */

      let canSelfBook =
        count > 0;


      selectedClassIds.forEach(
        function(classId) {

          const cls =
            classes.find(
              function(item) {

                return String(
                  item.classId
                ) ===
                String(classId);

              }
            );


          if (!cls) {
            return;
          }


          const myBookings =
            cls.myBookings || [];


          const hasMyBooking =
            myBookings.length > 0 ||
            cls.bookedByMe === true;


          if (hasMyBooking) {

            canSelfBook = false;

          }

        }
      );


      document
        .getElementById(
          "selfButton"
        )
        .disabled =
          count === 0 ||
          isSubmitting ||
          !canSelfBook;


      /*
       * 幫朋友預約：
       *
       * 只要有選課、且尚未滿，
       * 就可以按。
       *
       * 已滿的課程不會被加入選擇，
       * 但這裡仍保留簡單判斷。
       */

      let canGuestBook =
        count > 0;


      selectedClassIds.forEach(
        function(classId) {

          const cls =
            classes.find(
              function(item) {

                return String(
                  item.classId
                ) ===
                String(classId);

              }
            );


          if (
            cls &&
            Number(cls.count) >=
            Number(cls.maxPeople)
          ) {

            canGuestBook = false;

          }

        }
      );


      document
        .getElementById(
          "guestButton"
        )
        .disabled =
          count === 0 ||
          isSubmitting ||
          !canGuestBook;

    }


    /*
     * ============================================================
     * 共用：送出後如果 callback 沒回來，
     *       用最新課程資料確認結果。
     *
     * fallbackDelay = 1200ms
     * 不再使用 8 秒長等待。
     * ============================================================
     */

    function runBookingAction(
      action,
      params,
      loadingMessage,
      successMessage,
      successMessageFunction
    ) {

      if (isSubmitting) {
        return;
      }


      isSubmitting = true;

      showLoading(
        loadingMessage
      );

      updateBottomBar();


      const callbackName =
        "gasActionCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;

      let fallbackTimer = null;


      function finish() {

        if (finished) {
          return;
        }


        finished = true;


        if (fallbackTimer) {

          clearTimeout(
            fallbackTimer
          );

          fallbackTimer = null;

        }


        isSubmitting = false;

        hideLoading();

        updateBottomBar();


        cleanupJsonp(
          callbackName,
          script
        );

      }


      function finishWithData(
        data,
        message
      ) {

        try {

          selectedClassIds = [];

          applyBookingData(data);


          if (
            successMessageFunction
          ) {

            showStatus(
              successMessageFunction(
                data
              ),
              "success"
            );

          } else {

            showStatus(
              message ||
              "操作完成",
              "success"
            );

          }

        } catch (error) {

          console.error(error);

          showStatus(
            error.message ||
            "更新畫面失敗",
            "error"
          );

        } finally {

          finish();

        }

      }


      function syncAfterAction() {

        if (finished) {
          return;
        }


        /*
         * 先停止原本 action callback 的等待。
         * 後端寫入通常已經完成，
         * 接著直接讀最新課程。
         */

        cleanupJsonp(
          callbackName,
          script
        );


        refreshClassesSilently(
          function(data) {

            if (finished) {
              return;
            }


            finishWithData(
              data,
              successMessage
            );

          },
          function(error) {

            console.error(
              "第一次同步失敗：",
              error
            );


            /*
             * 再給一次短暫重試，
             * 避免 Google Sheet 剛寫完時
             * 第一次讀取還沒同步。
             */

            setTimeout(
              function() {

                if (finished) {
                  return;
                }


                refreshClassesSilently(
                  function(data) {

                    if (finished) {
                      return;
                    }


                    finishWithData(
                      data,
                      successMessage
                    );

                  },
                  function(secondError) {

                    console.error(
                      "第二次同步失敗：",
                      secondError
                    );


                    finish();


                    showStatus(
                      "後端可能已完成，但目前無法更新畫面，請重新開啟課程預約確認。",
                      "error"
                    );

                  }
                );

              },
              800
            );

          }
        );

      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {

              throw new Error(
                "GAS 沒有回傳資料"
              );

            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "操作失敗"
              );

            }


            const data =
              response.data;


            finishWithData(
              data,
              successMessage
            );


          } catch (error) {

            console.error(error);

            finish();


            showStatus(
              error.message ||
              "操作失敗",
              "error"
            );

          }

        };


      script.onerror =
        function() {

          /*
           * JSONP 連線錯誤不直接判定後端失敗。
           * 因為後端可能已經完成寫入。
           */

          syncAfterAction();

        };


      let url =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=" +
        encodeURIComponent(
          action
        ) +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&_t=" +
        Date.now();


      Object.keys(
        params || {}
      ).forEach(
        function(key) {

          url +=
            "&" +
            encodeURIComponent(
              key
            ) +
            "=" +
            encodeURIComponent(
              params[key]
            );

        }
      );


      script.src = url;


      document.body.appendChild(
        script
      );


      /*
       * 重要：
       *
       * 不再等 8 秒。
       *
       * 1.2 秒沒有 callback，
       * 就直接讀最新課程。
       */

      fallbackTimer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            syncAfterAction();

          },
          1200
        );
    }


    /*
     * ==========================
     * 自己預約
     * ==========================
     */

    function submitSelfBookings() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {
        return;
      }

      const ids =
        Array.from(
          new Set(
            selectedClassIds.map(function(id) {
              return String(id);
            })
          )
        );

      const selectedDateTexts =
        ids.map(function(classId) {

          const cls =
            classes.find(function(item) {
              return String(item.classId) ===
                String(classId);
            });

          if (!cls) {
            return "未知課程(" + classId + ")";
          }

          return (
            cls.date +
            "（" +
            cls.weekday +
            "） " +
            cls.time
          );
        });

      console.log(
        "【自己預約】實際送出 selectedClassIds =",
        ids
      );

      console.log(
        "【自己預約】實際送出課程 =",
        selectedDateTexts
      );

      if (
        !confirm(
          "確定要預約以下 " +
          ids.length +
          " 堂課嗎？\n\n" +
          selectedDateTexts.join("\n")
        )
      ) {
        return;
      }

      runBookingAction(
        "submitBookings",
        {
          selectedClassIds:
            JSON.stringify(ids)
        },
        "預約處理中，請稍候...",
        "預約完成",
        function(data) {

          console.log(
            "【自己預約】GAS 實際處理 requestedClassIds =",
            data.requestedClassIds || []
          );

          console.log(
            "【自己預約】GAS results =",
            data.results || []
          );

          console.log(
            "【自己預約】線下既有預約 =",
            (data.results || []).filter(function(r) {
              return r.status === "OFFLINE_BOOKED";
            })
          );

          const successDates =
            (data.results || [])
              .filter(function(r) {
                return (
                  r.status === "BOOKED" ||
                  r.success === true
                );
              })
              .map(function(r) {

                const cls =
                  classes.find(function(item) {
                    return String(item.classId) ===
                      String(r.classId);
                  });

                return cls
                  ? cls.date + "（" + cls.weekday + "）"
                  : String(r.classId);

              });

          return (
            successDates.length
              ? "預約完成：\n" +
                successDates.join("、")
              : "沒有新增成功的預約"
          );
        }
      );
    }


    /*
     * ==========================
     * Guest Modal
     * ==========================
     */

    function openGuestModal() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {

        return;
      }


      document
        .getElementById(
          "guestNameInput"
        )
        .value = "";


      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "flex";


      setTimeout(
        function() {

          document
            .getElementById(
              "guestNameInput"
            )
            .focus();

        },
        100
      );
    }


    function closeGuestModal() {

      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "none";
    }


    /*
     * ==========================
     * 幫朋友預約
     * ==========================
     */

    function confirmGuestBooking() {

      if (isSubmitting) {
        return;
      }


      const guestName =
        document
          .getElementById(
            "guestNameInput"
          )
          .value
          .trim();


      if (!guestName) {

        alert(
          "請輸入參加者姓名"
        );

        return;
      }


      if (
        guestName.length > 30
      ) {

        alert(
          "姓名最多 30 個字"
        );

        return;
      }


      if (
        !selectedClassIds.length
      ) {

        return;
      }


      // =====================================================
      // 送出前重新整理選擇清單
      // =====================================================
      const ids = Array.from(
        new Set(
          selectedClassIds.map(function(id) {
            return String(id);
          })
        )
      );

      if (!ids.length) {
        alert("沒有選擇任何課程");
        return;
      }

      // =====================================================
      // 把「實際準備送給 GAS 的日期」顯示給使用者確認
      // 避免畫面看的是 A、B、C，實際送出的卻是其他日期。
      // =====================================================
      const selectedDateTexts = ids
        .map(function(classId) {
          const cls = classes.find(function(item) {
            return String(item.classId) === String(classId);
          });

          if (!cls) {
            return "未知課程(" + classId + ")";
          }

          return (
            cls.date +
            "（" +
            cls.weekday +
            "） " +
            cls.time
          );
        });

      console.log(
        "【幫朋友預約】實際送出 selectedClassIds =",
        ids
      );

      console.log(
        "【幫朋友預約】實際送出課程 =",
        selectedDateTexts
      );

      const confirmMessage =
        "確定要幫「" +
        guestName +
        "」預約以下 " +
        ids.length +
        " 堂課嗎？\n\n" +
        selectedDateTexts.join("\n");

      if (!confirm(confirmMessage)) {
        return;
      }

      closeGuestModal();


      runBookingAction(
        "submitGuestBookings",
        {
          guestName:
            guestName,

          selectedClassIds:
            JSON.stringify(ids)
        },
        "正在幫「" +
        guestName +
        "」預約，請稍候...",
        "代訂完成",
        function(data) {

          console.log(
            "【幫朋友預約】GAS 實際處理 requestedClassIds =",
            data.requestedClassIds || []
          );

          console.log(
            "【幫朋友預約】GAS results =",
            data.results || []
          );

          const successCount =
            (data.results || [])
              .filter(
                function(r) {
                  return r.success;
                }
              )
              .length;


          const successDates =
            (data.results || [])
              .filter(function(r) {
                return r.success;
              })
              .map(function(r) {
                const cls =
                  classes.find(function(item) {
                    return String(item.classId) ===
                      String(r.classId);
                  });

                return cls
                  ? cls.date + "（" + cls.weekday + "）"
                  : String(r.classId);
              });

          if (successCount === 0) {
            return (
              "「" +
              guestName +
              "」沒有新增成功的代訂課程"
            );
          }

          return (
            "已幫「" +
            guestName +
            "」預約 " +
            successCount +
            " 堂課：\n" +
            successDates.join("、")
          );

        }
      );
    }


    /*
     * ==========================
     * 取消：共用
     * ==========================
     */

    function cancelBookingById(
      bookingId,
      date,
      time,
      name
    ) {

      if (isSubmitting) {
        return;
      }


      if (
        !confirm(
          "確定要取消「" +
          name +
          "」在 " +
          date +
          " " +
          time +
          " 的預約嗎？"
        )
      ) {

        return;
      }


      runBookingAction(
        "cancelBookingById",
        {
          bookingId:
            bookingId
        },
        "取消預約處理中，請稍候...",
        "已取消「" +
        name +
        "」的預約"
      );
    }


    /*
     * 舊資料沒有 bookingId 時，
     * 自己的預約仍可透過 classId 取消。
     */

    function cancelMyClassBooking(
      classId,
      date,
      time,
      name
    ) {

      if (isSubmitting) {
        return;
      }


      if (
        !confirm(
          "確定要取消「" +
          name +
          "」在 " +
          date +
          " " +
          time +
          " 的預約嗎？"
        )
      ) {

        return;
      }


      runBookingAction(
        "cancelBooking",
        {
          classId:
            classId
        },
        "取消預約處理中，請稍候...",
        "已取消「" +
        name +
        "」的預約"
      );
    }


    function cleanupJsonp(
      callbackName,
      script
    ) {

      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );
      }
    }

  </script>
