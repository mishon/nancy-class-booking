  <script>

    const LIFF_ID =
      "2011656647-X8PhmAQI";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


    let idToken = "";

    let classes = [];

    let selectedClassIds = [];

    let isSubmitting = false;


    // 不讓 LINE ID Token 長時間留在頁面記憶體中
    // 離開頁面時清除。
    window.addEventListener("pagehide", function() {
      idToken = "";
    });


    window.addEventListener(
      "load",
      init
    );


    async function init() {
  const status = document.getElementById("status");
  const welcome = document.getElementById("welcomeText");

  try {
    // 先確定 HTML / JavaScript 本身有正常執行
    welcome.textContent = "V5 正在啟動...";

    showStatus("① 開始初始化 LIFF...", "info");

    // 防止 liff.init() 無限卡住
    const initPromise = liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    const timeoutPromise = new Promise(function(_, reject) {
      setTimeout(function() {
        reject(
          new Error(
            "LIFF 初始化超過 15 秒，可能是 LINE LIFF 初始化沒有完成。"
          )
        );
      }, 15000);
    });

    await Promise.race([
      initPromise,
      timeoutPromise
    ]);

    showStatus("② LIFF 初始化完成", "success");

    console.log("LIFF 初始化完成");
    console.log("LIFF ID:", LIFF_ID);
    console.log("isInClient:", liff.isInClient());
    console.log("isLoggedIn:", liff.isLoggedIn());

    if (!liff.isLoggedIn()) {

      showStatus(
        "③ LINE 尚未登入",
        "error"
      );

      throw new Error(
        "LINE 尚未登入，請重新從 LINE 開啟課程預約。"
      );
    }

    showStatus(
      "③ LINE 登入狀態正常",
      "success"
    );

    idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error(
        "無法取得 LINE ID Token"
      );
    }

    showStatus(
      "④ 已取得 LINE 身分，正在取得課程...",
      "info"
    );

    loadClasses();

  } catch (error) {

    console.error(
      "LIFF 初始化失敗:",
      error
    );

    hideLoading();

    showStatus(
      "❌ " +
      (error.message || String(error)),
      "error"
    );
  }
}


    function showLoading(message) {

      document
        .getElementById(
          "loadingText"
        )
        .textContent =
          message ||
          "載入中，請稍候...";


      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "flex";
    }


    function hideLoading() {

      document
        .getElementById(
          "loadingOverlay"
        )
        .style.display =
          "none";
    }


    function showStatus(
      message,
      type
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.textContent =
        message;

      status.className =
        "status " +
        (type || "info");
    }


    function createSafeCallbackName(prefix) {

      let randomPart = "";

      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(2);
        window.crypto.getRandomValues(values);
        randomPart = values[0].toString(36) + values[1].toString(36);
      } else {
        randomPart = Math.random().toString(36).substring(2);
      }

      return prefix + Date.now().toString(36) + "_" + randomPart;
    }


    function loadClasses() {

      showLoading(
        "正在取得課程資料，請稍候..."
      );


      const callbackName =
        createSafeCallbackName("gasBookingCallback_");

      const script =
        document.createElement(
          "script"
        );

      script.referrerPolicy = "no-referrer";


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        hideLoading();

        cleanupJsonp(
          callbackName,
          script
        );
      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {

              throw new Error(
                "GAS 沒有回傳資料"
              );
            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "取得課程失敗"
              );
            }


            const data =
              response.data;


            classes =
              data.classes || [];


            document
              .getElementById(
                "welcomeText"
              )
              .textContent =
                (data.userName ||
                "LINE會員") +
                "，您好";


            selectedClassIds = [];


            renderClasses();

            updateBottomBar();


          } catch (error) {

            console.error(error);

            showStatus(
              error.message ||
              "取得課程失敗",
              "error"
            );

          } finally {

            finish();
          }

        };


      const url =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&_ts=" +
        Date.now();


      script.src = url;


      script.onerror =
        function() {

          showStatus(
            "無法連線到預約系統。",
            "error"
          );

          finish();

        };


      document.body.appendChild(
        script
      );
    }


    function renderClasses() {

      const container =
        document.getElementById(
          "classList"
        );

      container.innerHTML = "";


      if (!classes.length) {

        container.innerHTML =
          '<div class="empty">' +
          '目前沒有課程' +
          '</div>';

        return;
      }


      classes.forEach(function(cls) {

        container.appendChild(
          createClassCard(cls)
        );

      });
    }


    function createClassCard(cls) {

      const card =
        document.createElement(
          "div"
        );


      const isFull =
        Number(cls.count) >=
        Number(cls.maxPeople);


      const myBookings =
        cls.myBookings || [];
    
      const hasMyBooking =
        myBookings.length > 0 ||
        cls.bookedByMe === true;


      const selected =
        selectedClassIds.includes(
          cls.classId
        );


      let cardClass =
        "class-card";


      if (selected) {
        cardClass += " selected";
      }


      if (hasMyBooking) {

        cardClass +=
          " has-my-booking";

      }

      if (isFull) {

        cardClass +=
          " full";

      } else {

        // 即使自己已經預約，只要還有名額，
        // 仍可選取這堂課來幫朋友預約。
        cardClass +=
          " selectable";
      }


      card.className =
        cardClass;


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "class-header";


      const left =
        document.createElement(
          "div"
        );


      const date =
        document.createElement(
          "span"
        );

      date.className =
        "class-date";

      date.textContent =
        cls.date;


      const weekday =
        document.createElement(
          "span"
        );

      weekday.className =
        "class-weekday";

      weekday.textContent =
        "星期" +
        cls.weekday;


      left.appendChild(date);

      left.appendChild(weekday);


      const count =
        document.createElement(
          "div"
        );


      count.className =
        "class-count " +
        (
          isFull
            ? "count-full"
            : "count-open"
        );


      count.textContent =
        cls.count +
        " / " +
        cls.maxPeople;


      header.appendChild(left);

      header.appendChild(count);

      card.appendChild(header);


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "class-time";

      time.textContent =
        "上課時間：" +
        cls.time;

      card.appendChild(time);
      
      /* 
       * 選取狀態提示
       */
      if (selected) {
      
        const selectionLabel =
          document.createElement("div");
      
        selectionLabel.style.marginTop = "10px";
        selectionLabel.style.fontSize = "13px";
        selectionLabel.style.fontWeight = "600";
      
        if (hasMyBooking) {
      
          selectionLabel.style.color = "#f59e0b";
          selectionLabel.textContent =
            "🟠 已選取：準備幫朋友預約";
      
        } else {
      
          selectionLabel.style.color = "#1a73e8";
          selectionLabel.textContent =
            "🔵 已選取";
      
        }
      
        card.appendChild(selectionLabel);
      }


      /*
       * 所有參加者
       */

      if (
        cls.names &&
        cls.names.length
      ) {

        const names =
          document.createElement(
            "div"
          );

        names.className =
          "name-list";

        names.textContent =
          "目前預約：" +
          cls.names.join("、");

        card.appendChild(names);
      }


      /*
       * 我的預約
       */

/*
 * 我的預約
 */

if (myBookings.length) {

  const myBox =
    document.createElement(
      "div"
    );

  myBox.className =
    "my-bookings";


  myBookings.forEach(
    function(booking) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "my-booking-item";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "my-booking-name";

      name.textContent =
        booking.name;


      // =========================
      // 幫朋友預約
      // =========================

      if (
        booking.isGuest
      ) {

        const label =
          document.createElement(
            "span"
          );

        label.className =
          "guest-label";

        label.textContent =
          "（代訂）";

        name.appendChild(
          label
        );

      }


      // =========================
      // 取消按鈕
      // =========================

      const cancel =
        document.createElement(
          "button"
        );

      cancel.className =
        "cancel-button";

      cancel.textContent =
        "取消";


      cancel.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          cancelBookingById(
            booking.bookingId,
            cls.date,
            cls.time,
            booking.name
          );

        }
      );


      item.appendChild(name);

      item.appendChild(cancel);

      myBox.appendChild(item);

    }
  );


  card.appendChild(myBox);


} else if (
  cls.bookedByMe === true
) {

  /*
   * =========================
   * 自己預約
   *
   * 如果後端只有回傳
   * bookedByMe=true
   * 但沒有 myBookings，
   * 仍然提供取消按鈕。
   * =========================
   */

  const myBox =
    document.createElement(
      "div"
    );

  myBox.className =
    "my-bookings";


  const item =
    document.createElement(
      "div"
    );

  item.className =
    "my-booking-item";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "my-booking-name";

  name.textContent =
    "我的預約";


  const cancel =
    document.createElement(
      "button"
    );

  cancel.className =
    "cancel-button";

  cancel.textContent =
    "取消";


  cancel.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      if (isSubmitting) {
        return;
      }


      if (
        !confirm(
          "確定要取消「" +
          cls.date +
          " " +
          cls.time +
          "」的預約嗎？"
        )
      ) {
        return;
      }


      isSubmitting = true;

      showLoading(
        "取消預約處理中，請稍候..."
      );

      updateBottomBar();


      const callbackName =
        createSafeCallbackName("gasCancelCallback_");


      const script =
        document.createElement(
          "script"
        );

      script.referrerPolicy = "no-referrer";


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        isSubmitting = false;

        hideLoading();

        updateBottomBar();

        cleanupJsonp(
          callbackName,
          script
        );

      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {
              throw new Error(
                "GAS 沒有回傳資料"
              );
            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "取消失敗"
              );

            }


            const data =
              response.data;

            classes =
              data.classes || [];

            selectedClassIds = [];

            renderClasses();

            updateBottomBar();


            showStatus(
              "已取消 " +
              cls.date +
              " 的預約",
              "success"
            );


          } catch (error) {

            console.error(error);

            showStatus(
              error.message ||
              "取消失敗",
              "error"
            );

          } finally {

            finish();

          }

        };


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=cancelBooking" +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&classId=" +
        encodeURIComponent(
          cls.classId
        ) +
        "&_ts=" +
        Date.now();


      script.onerror =
        function() {

          showStatus(
            "取消系統連線失敗。",
            "error"
          );

          finish();

        };


      document.body.appendChild(
        script
      );

    }
  );


  item.appendChild(name);

  item.appendChild(cancel);

  myBox.appendChild(item);

  card.appendChild(myBox);
}

      /*
       * 可以選擇：
       *
       * 只要這堂課沒有自己的預約
       * 且還有名額
       */

      /*
 * =========================
 * 課程選擇
 *
 * 尚未預約：
 *   可以自己預約 / 幫朋友預約
 *
 * 已經自己預約：
 *   不可以再次自己預約
 *   但仍然可以幫朋友預約
 *
 * 已滿：
 *   不可以再預約
 * =========================
 */

if (!isFull) {

  card.addEventListener(
    "click",
    function(event) {

      if (isSubmitting) {
        return;
      }


      /*
       * 如果點的是「取消」按鈕，
       * 不要觸發課程選擇。
       */
      if (
        event.target &&
        event.target.closest &&
        event.target.closest(
          ".cancel-button"
        )
      ) {
        return;
      }


      toggleSelection(
        cls.classId
      );

    }
  );

}

      return card;
    }


    function toggleSelection(
      classId
    ) {

      if (isSubmitting) {
        return;
      }


      const index =
        selectedClassIds.indexOf(
          classId
        );


      if (index >= 0) {

        selectedClassIds.splice(
          index,
          1
        );

      } else {

        selectedClassIds.push(
          classId
        );
      }


      renderClasses();

      updateBottomBar();
    }


    function updateBottomBar() {

      const count =
        selectedClassIds.length;
    
    
      document
        .getElementById(
          "selectedInfo"
        )
        .textContent =
          count
            ? "已選擇 " +
              count +
              " 堂課程"
            : "尚未選擇課程";


      /*
       * =========================
       * 判斷目前選取的課程
       * 是否全部都是「尚未預約」
       * =========================
       */
    
      let canSelfBook = true;
    
    
      selectedClassIds.forEach(
        function(classId) {
    
          const cls =
            classes.find(
              function(item) {
    
                return String(
                  item.classId
                ) === String(
                  classId
                );
    
              }
            );
    
    
          if (!cls) {
            return;
          }
    
    
          const myBookings =
            cls.myBookings || [];
    
    
          const hasMyBooking =
            myBookings.length > 0 ||
            cls.bookedByMe === true;
    
    
          if (hasMyBooking) {
            canSelfBook = false;
          }
    
        }
      );


  /*
   * 自己預約：
   *
   * 只有所有選取課程
   * 都還沒有自己的預約
   * 才可以按
   */

  document
    .getElementById(
      "selfButton"
    )
    .disabled =
      count === 0 ||
      isSubmitting ||
      !canSelfBook;


  /*
   * 幫朋友預約：
   *
   * 只要有選課就可以
   */

  document
    .getElementById(
      "guestButton"
    )
    .disabled =
      count === 0 ||
      isSubmitting;

}


    /*
     * ==========================
     * 自己預約
     * ==========================
     */

    function submitSelfBookings() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {
        return;
      }


      const ids = Array.from(new Set(selectedClassIds.map(String)));

      if (ids.length === 0 || ids.length > 31) {
        showStatus("選擇的課程數量不合法。", "error");
        return;
      }


      if (
        !confirm(
          "確定要預約所選的 " +
          ids.length +
          " 堂課嗎？"
        )
      ) {

        return;
      }


      isSubmitting = true;

      showLoading(
        "預約處理中，請稍候..."
      );

      updateBottomBar();


      const callbackName =
        createSafeCallbackName("gasSubmitCallback_");


      const script =
        document.createElement(
          "script"
        );

      script.referrerPolicy = "no-referrer";


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        isSubmitting = false;

        hideLoading();

        updateBottomBar();

        cleanupJsonp(
          callbackName,
          script
        );
      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {
              throw new Error(
                "GAS 沒有回傳資料"
              );
            }


            if (!response.success) {
              throw new Error(
                response.message ||
                "預約失敗"
              );
            }


            const data =
              response.data;


            /*
             * =========================
             * 直接使用預約 API 回傳的
             * 最新課程資料
             *
             * 不再另外呼叫 loadClasses()
             *
             * 原因：
             * submitSelectedBookings()
             * 已經在後端完成寫入後，
             * 回傳最新的 classes。
             *
             * 如果再立刻呼叫 loadClasses()
             * 可能會短暫讀到尚未同步完成的
             * 舊資料，造成：
             *
             * 1 / 8
             * ↓
             * 0 / 8
             * ↓
             * 1 / 8
             *
             * 現在直接使用這次預約 API
             * 回傳的 classes，就不會閃回 0 / 8。
             * =========================
             */

            classes =
              data.classes || [];


            selectedClassIds = [];


            renderClasses();

            updateBottomBar();


            showStatus(
              "預約完成",
              "success"
            );


          } catch (error) {

            console.error(error);

            showStatus(
              error.message ||
              "預約失敗",
              "error"
            );

          } finally {

            finish();

          }

        };


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=submitBookings" +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&selectedClassIds=" +
        encodeURIComponent(
          JSON.stringify(ids)
        ) +
        "&_ts=" +
        Date.now();


      script.onerror =
        function() {

          // GAS 可能已完成寫入，但 JSONP 回應沒有正常回到 LIFF。
          // 不直接判定預約失敗，先重新取得最新課程確認結果。
          console.warn("預約 API 回應異常，正在確認預約結果。");

          isSubmitting = false;
          hideLoading();
          cleanupJsonp(callbackName, script);

          showStatus(
            "系統回應較慢，正在確認預約結果...",
            "info"
          );

          setTimeout(function() {
            loadClasses();
          }, 1200);

        };


      document.body.appendChild(
        script
      );
    }


    /*
     * ==========================
     * Guest Modal
     * ==========================
     */

    function openGuestModal() {

      if (
        isSubmitting ||
        !selectedClassIds.length
      ) {

        return;
      }


      document
        .getElementById(
          "guestNameInput"
        )
        .value = "";


      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "flex";


      setTimeout(function() {

        document
          .getElementById(
            "guestNameInput"
          )
          .focus();

      }, 100);
    }


    function closeGuestModal() {

      document
        .getElementById(
          "guestModal"
        )
        .style.display =
          "none";
    }


    function confirmGuestBooking() {

      if (isSubmitting) {
        return;
      }


      const guestName =
        document
          .getElementById(
            "guestNameInput"
          )
          .value
          .trim();


      if (!guestName) {

        alert(
          "請輸入參加者姓名"
        );

        return;
      }


      if (guestName.length > 30) {

        alert(
          "姓名最多 30 個字"
        );

        return;
      }


      const ids = Array.from(new Set(selectedClassIds.map(String)));

      if (ids.length === 0 || ids.length > 31) {
        showStatus("選擇的課程數量不合法。", "error");
        return;
      }


      closeGuestModal();


      isSubmitting = true;

      showLoading(
        "正在幫「" +
        guestName +
        "」預約，請稍候..."
      );

      updateBottomBar();


      const callbackName =
        createSafeCallbackName("gasGuestCallback_");


      const script =
        document.createElement(
          "script"
        );

      script.referrerPolicy = "no-referrer";


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        isSubmitting = false;

        hideLoading();

        updateBottomBar();

        cleanupJsonp(
          callbackName,
          script
        );
      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {

              throw new Error(
                "GAS 沒有回傳資料"
              );
            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "代訂失敗"
              );
            }


            const data =
              response.data;


            classes =
              data.classes || [];


            selectedClassIds = [];


            renderClasses();

            updateBottomBar();


            const successCount =
              (data.results || [])
                .filter(function(r) {
                  return r.success;
                })
                .length;


            showStatus(
              "已幫「" +
              guestName +
              "」預約 " +
              successCount +
              " 堂課",
              "success"
            );


          } catch (error) {

            console.error(error);

            showStatus(
              error.message ||
              "代訂失敗",
              "error"
            );

          } finally {

            finish();
          }

        };


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=submitGuestBookings" +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&guestName=" +
        encodeURIComponent(
          guestName
        ) +
        "&selectedClassIds=" +
        encodeURIComponent(
          JSON.stringify(ids)
        ) +
        "&_ts=" +
        Date.now();


      script.onerror =
        function() {

          // GAS 可能已完成幫朋友預約，但 JSONP 回應沒有正常回來。
          console.warn("代訂 API 回應異常，正在確認代訂結果。");

          isSubmitting = false;
          hideLoading();
          cleanupJsonp(callbackName, script);

          showStatus(
            "系統回應較慢，正在確認代訂結果...",
            "info"
          );

          setTimeout(function() {
            loadClasses();
          }, 1200);

        };


      document.body.appendChild(
        script
      );
    }


    /*
     * ==========================
     * 取消預約
     * ==========================
     */

    function cancelBookingById(
      bookingId,
      date,
      time,
      name
    ) {

      if (isSubmitting) {
        return;
      }


      if (
        !confirm(
          "確定要取消「" +
          name +
          "」在 " +
          date +
          " " +
          time +
          " 的預約嗎？"
        )
      ) {

        return;
      }


      isSubmitting = true;

      showLoading(
        "取消預約處理中，請稍候..."
      );

      updateBottomBar();


      const callbackName =
        createSafeCallbackName("gasCancelCallback_");


      const script =
        document.createElement(
          "script"
        );

      script.referrerPolicy = "no-referrer";


      let finished = false;


      function finish() {

        if (finished) {
          return;
        }

        finished = true;

        isSubmitting = false;

        hideLoading();

        updateBottomBar();

        cleanupJsonp(
          callbackName,
          script
        );
      }


      window[callbackName] =
        function(response) {

          try {

            if (!response) {

              throw new Error(
                "GAS 沒有回傳資料"
              );
            }


            if (!response.success) {

              throw new Error(
                response.message ||
                "取消失敗"
              );
            }


            const data =
              response.data;


            classes =
              data.classes || [];


            selectedClassIds = [];


            renderClasses();

            updateBottomBar();


            showStatus(
              "已取消「" +
              name +
              "」的預約",
              "success"
            );


          } catch (error) {

            console.error(error);

            showStatus(
              error.message ||
              "取消失敗",
              "error"
            );

          } finally {

            finish();
          }

        };


      script.src =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=cancelBookingById" +
        "&idToken=" +
        encodeURIComponent(
          idToken
        ) +
        "&bookingId=" +
        encodeURIComponent(
          bookingId
        ) +
        "&_ts=" +
        Date.now();


      script.onerror =
        function() {

          /*
           * GAS 可能已經完成取消寫入，
           * 但 JSONP 回應在瀏覽器端被判定為連線錯誤。
           *
           * 不要直接顯示「取消失敗」，
           * 先重新取得最新課程資料。
           * 如果後端已經寫入 CANCELLED，
           * 重新載入後畫面就會反映最新狀態。
           */
          console.warn(
            "取消 API 回應異常，重新取得最新課程資料確認狀態。",
            bookingId
          );

          isSubmitting = false;
          hideLoading();
          cleanupJsonp(
            callbackName,
            script
          );

          showStatus(
            "系統回應較慢，正在確認取消結果...",
            "info"
          );

          setTimeout(function() {
            loadClasses();
          }, 1200);

        };


      document.body.appendChild(
        script
      );
    }


    function cleanupJsonp(
      callbackName,
      script
    ) {

      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );
      }
    }

  </script>
