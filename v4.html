<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>課程預約</title>

  <!-- =====================================================
       LINE LIFF SDK
       ===================================================== -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #f7f7f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color: #222;
    }


    .container {

      max-width: 600px;

      margin: 20px auto;

      padding-bottom: 130px;
    }


    /* =====================================================
       Header
       ===================================================== */

    .header {

      background: white;

      padding: 24px;

      border-radius: 18px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);
    }


    h1 {

      margin: 0 0 8px 0;

      font-size: 30px;

      line-height: 1.3;
    }


    .user {

      color: #666;

      font-size: 17px;
    }


    /* =====================================================
       Status
       ===================================================== */

    .status {

      background: white;

      padding: 18px;

      border-radius: 16px;

      margin-bottom: 16px;

      line-height: 1.7;

      font-size: 17px;

      white-space: pre-wrap;
    }


    /* =====================================================
       Result
       ===================================================== */

    .result {

      background: white;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }


    .result-title {

      font-size: 23px;

      font-weight: 700;

      margin-bottom: 14px;
    }


    .result-success {

      color: #16803c;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.7;

      margin-bottom: 8px;
    }


    .result-failed {

      color: #d93025;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.7;

      margin-bottom: 8px;
    }


    /* =====================================================
       Class Card
       ===================================================== */

    .class-card {

      position: relative;

      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 14px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

      cursor: pointer;

      transition:
        transform 0.1s,
        box-shadow 0.1s;
    }


    .class-card:active {

      transform: scale(0.99);
    }


    .class-card.selected {

      box-shadow:
        0 0 0 3px #1a73e8;
    }


    .class-card.disabled {

      opacity: 0.55;

      cursor: default;
    }


    /* =====================================================
       Checkbox
       ===================================================== */

    .checkbox {

      position: absolute;

      top: 20px;

      right: 20px;

      width: 28px;

      height: 28px;

      border: 3px solid #aaa;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 17px;

      font-weight: 700;
    }


    .class-card.selected .checkbox {

      background: #1a73e8;

      border-color: #1a73e8;

      color: white;
    }


    .class-card.disabled .checkbox {

      border-color: #ccc;
    }


    /* =====================================================
       Date
       ===================================================== */

    .class-date {

      font-size: 23px;

      font-weight: 700;

      margin-bottom: 6px;

      padding-right: 48px;
    }


    /* =====================================================
       Time
       ===================================================== */

    .class-time {

      font-size: 18px;

      color: #555;

      margin-bottom: 12px;
    }


    /* =====================================================
       Count
       ===================================================== */

    .class-count {

      font-size: 17px;

      margin-bottom: 8px;
    }


    /* =====================================================
       Status text
       ===================================================== */

    .available {

      color: #16803c;

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 6px;
    }


    .full {

      color: #d93025;

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 6px;
    }


    .booked {

      color: #1a73e8;

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 6px;
    }


    /* =====================================================
       Names
       ===================================================== */

    .class-names {

      color: #666;

      font-size: 15px;

      line-height: 1.6;
    }


    /* =====================================================
       Bottom booking bar
       ===================================================== */

    .booking-bar {

      position: fixed;

      left: 0;

      right: 0;

      bottom: 0;

      z-index: 100;

      background: white;

      padding: 16px 20px 20px;

      box-shadow:
        0 -3px 16px rgba(0, 0, 0, 0.12);
    }


    .booking-bar-inner {

      max-width: 600px;

      margin: 0 auto;
    }


    .selected-info {

      text-align: center;

      margin-bottom: 12px;

      color: #555;

      font-size: 17px;

      font-weight: 600;
    }


    .booking-button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 16px;

      font-size: 20px;

      font-weight: 700;

      background: #1a73e8;

      color: white;

      cursor: pointer;
    }


    .booking-button:disabled {

      background: #ccc;

      cursor: default;
    }


    /* =====================================================
       Loading
       ===================================================== */

    .loading {

      text-align: center;

      padding: 30px 20px;

      color: #666;

      font-size: 17px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       Header
       ===================================================== -->

  <div class="header">

    <h1>課程預約</h1>

    <div
      id="userName"
      class="user"
    >
      使用者資料載入中...
    </div>

  </div>


  <!-- =====================================================
       Status
       ===================================================== -->

  <div
    id="status"
    class="status"
  >
    ① 初始化 LIFF...
  </div>


  <!-- =====================================================
       預約結果
       ===================================================== -->

  <div
    id="result"
    class="result"
    style="display:none;"
  ></div>


  <!-- =====================================================
       課程列表
       ===================================================== -->

  <div id="classes">

    <div class="loading">
      課程資料載入中...
    </div>

  </div>


</div>


<!-- =======================================================
     Bottom Booking Bar
     ======================================================= -->

<div
  id="bookingBar"
  class="booking-bar"
  style="display:none;"
>

  <div class="booking-bar-inner">

    <div
      id="selectedInfo"
      class="selected-info"
    >
      尚未選擇課程
    </div>


    <button
      id="bookingButton"
      class="booking-button"
      disabled
    >
      確定預約
    </button>

  </div>

</div>


<script>


// =========================================================
// 基本設定
// =========================================================

const LIFF_ID =
  "2011656647-Tw5kY4xl";


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


// =========================================================
// 全域變數
// =========================================================

let idToken = "";

let classes = [];

let selectedClassIds = [];

let isSubmitting = false;


// =========================================================
// Status
// =========================================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


// =========================================================
// HTML Escape
// =========================================================

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =========================================================
// 顯示錯誤
// =========================================================

function showError(message) {

  console.error(message);

  setStatus(
    "❌ 發生錯誤\n\n" +
    message
  );

}


// =========================================================
// GAS：取得課程資料
// =========================================================

window.gasBookingCallback =
  function(response) {

    console.log(
      "GAS Booking Response:",
      response
    );


    if (!response) {

      showError(
        "GAS 回傳空資料"
      );

      return;
    }


    if (!response.success) {

      showError(
        response.message ||
        "取得課程資料失敗"
      );

      return;
    }


    const data =
      response.data;


    if (!data) {

      showError(
        "GAS 沒有回傳課程資料"
      );

      return;
    }


    // -----------------------------------------------------
    // 使用者名稱
    // -----------------------------------------------------

    document.getElementById(
      "userName"
    ).textContent =
      "您好，" +
      (data.userName || "會員");


    // -----------------------------------------------------
    // 課程資料
    // -----------------------------------------------------

    classes =
      Array.isArray(data.classes)
        ? data.classes
        : [];


    // -----------------------------------------------------
    // 清除選擇
    // -----------------------------------------------------

    selectedClassIds = [];


    // -----------------------------------------------------
    // 顯示課程
    // -----------------------------------------------------

    renderClasses();


    setStatus(
      "⑥ 課程資料取得成功\n\n" +
      "請選擇要預約的日期"
    );

  };


// =========================================================
// 載入課程
// =========================================================

function loadClasses() {

  setStatus(
    "正在取得課程資料..."
  );


  const oldScript =
    document.getElementById(
      "gas-booking-script"
    );


  if (oldScript) {

    oldScript.remove();

  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "gas-booking-script";


  script.src =
    GAS_URL +
    "?callback=gasBookingCallback" +
    "&idToken=" +
    encodeURIComponent(
      idToken
    ) +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      showError(
        "無法載入課程資料"
      );

    };


  document.body.appendChild(
    script
  );

}


// =========================================================
// Render Classes
// =========================================================

function renderClasses() {

  const container =
    document.getElementById(
      "classes"
    );


  container.innerHTML = "";


  if (!classes.length) {

    container.innerHTML =
      '<div class="class-card">' +
      "目前沒有課程" +
      "</div>";

    updateBookingBar();

    return;
  }


  classes.forEach(
    function(cls) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "class-card";


      const isFull =
        Number(cls.count) >=
        Number(cls.maxPeople);


      const isBooked =
        !!cls.bookedByMe;


      const isSelected =
        selectedClassIds.includes(
          cls.classId
        );


      // ---------------------------------------------------
      // Disabled
      // ---------------------------------------------------

      if (isFull || isBooked) {

        card.classList.add(
          "disabled"
        );

      }


      // ---------------------------------------------------
      // Selected
      // ---------------------------------------------------

      if (isSelected) {

        card.classList.add(
          "selected"
        );

      }


      // ---------------------------------------------------
      // Checkbox
      // ---------------------------------------------------

      const checkbox =
        document.createElement(
          "div"
        );


      checkbox.className =
        "checkbox";


      if (isSelected) {

        checkbox.textContent =
          "✓";

      }


      card.appendChild(
        checkbox
      );


      // ---------------------------------------------------
      // 日期
      // ---------------------------------------------------

      const date =
        document.createElement(
          "div"
        );


      date.className =
        "class-date";


      date.textContent =
        cls.date +
        "（" +
        cls.weekday +
        "）";


      // ---------------------------------------------------
      // 時間
      // ---------------------------------------------------

      const time =
        document.createElement(
          "div"
        );


      time.className =
        "class-time";


      time.textContent =
        cls.time;


      // ---------------------------------------------------
      // 人數
      // ---------------------------------------------------

      const count =
        document.createElement(
          "div"
        );


      count.className =
        "class-count";


      count.textContent =
        "目前 " +
        cls.count +
        " / " +
        cls.maxPeople +
        " 人";


      // ---------------------------------------------------
      // 狀態
      // ---------------------------------------------------

      const status =
        document.createElement(
          "div"
        );


      if (isBooked) {

        status.className =
          "booked";

        status.textContent =
          "✓ 已預約";

      }
      else if (isFull) {

        status.className =
          "full";

        status.textContent =
          "● 已額滿";

      }
      else {

        status.className =
          "available";

        status.textContent =
          "○ 可預約";

      }


      // ---------------------------------------------------
      // 已預約名單
      // ---------------------------------------------------

      const names =
        document.createElement(
          "div"
        );


      names.className =
        "class-names";


      if (
        Array.isArray(cls.names) &&
        cls.names.length > 0
      ) {

        names.textContent =
          "已預約：" +
          cls.names.join("、");

      }
      else {

        names.textContent =
          "目前尚無預約";

      }


      // ---------------------------------------------------
      // 加入卡片
      // ---------------------------------------------------

      card.appendChild(
        date
      );

      card.appendChild(
        time
      );

      card.appendChild(
        count
      );

      card.appendChild(
        status
      );

      card.appendChild(
        names
      );


      // ---------------------------------------------------
      // 點擊
      // ---------------------------------------------------

      if (!isFull && !isBooked) {

        card.addEventListener(
          "click",
          function() {

            toggleClass(
              cls.classId
            );

          }
        );

      }


      container.appendChild(
        card
      );

    }
  );


  updateBookingBar();

}


// =========================================================
// 選擇 / 取消選擇
// =========================================================

function toggleClass(classId) {

  if (isSubmitting) {
    return;
  }


  const index =
    selectedClassIds.indexOf(
      classId
    );


  if (index >= 0) {

    selectedClassIds.splice(
      index,
      1
    );

  }
  else {

    selectedClassIds.push(
      classId
    );

  }


  renderClasses();

}


// =========================================================
// 更新底部預約按鈕
// =========================================================

function updateBookingBar() {

  const bar =
    document.getElementById(
      "bookingBar"
    );


  const info =
    document.getElementById(
      "selectedInfo"
    );


  const button =
    document.getElementById(
      "bookingButton"
    );


  bar.style.display =
    "block";


  const count =
    selectedClassIds.length;


  if (count === 0) {

    info.textContent =
      "尚未選擇課程";


    button.disabled =
      true;


    return;
  }


  info.textContent =
    "已選擇 " +
    count +
    " 堂課程";


  button.disabled =
    isSubmitting;

}


// =========================================================
// 顯示預約結果
// =========================================================

function showBookingResult(
  data,
  submittedClassIds
) {

  const result =
    document.getElementById(
      "result"
    );


  result.style.display =
    "block";


  let html =
    '<div class="result-title">預約結果</div>';


  // =====================================================
  // 如果 GAS 有回傳 results
  // 優先使用 results
  // =====================================================

  if (
    data &&
    Array.isArray(data.results) &&
    data.results.length > 0
  ) {

    data.results.forEach(
      function(item) {

        const success =
          item.success === true ||
          item.status === "BOOKED" ||
          item.status === "SUCCESS";


        const date =
          item.date ||
          item.classDate ||
          item.courseDate ||
          "";


        const weekday =
          item.weekday ||
          "";


        const time =
          item.time ||
          "";


        const message =
          item.message ||
          "";


        if (success) {

          html +=
            '<div class="result-success">' +
            "✅ " +
            escapeHtml(date) +
            (
              weekday
                ? "（" +
                  escapeHtml(weekday) +
                  "）"
                : ""
            ) +
            (
              time
                ? " " +
                  escapeHtml(time)
                : ""
            ) +
            "　預約成功" +
            "</div>";

        }
        else {

          html +=
            '<div class="result-failed">' +
            "❌ " +
            escapeHtml(date) +
            (
              weekday
                ? "（" +
                  escapeHtml(weekday) +
                  "）"
                : ""
            ) +
            (
              time
                ? " " +
                  escapeHtml(time)
                : ""
            ) +
            "　" +
            escapeHtml(
              message ||
              "預約失敗"
            ) +
            "</div>";

        }

      }
    );

  }
  else if (
    data &&
    Array.isArray(data.classes)
  ) {

    // ===================================================
    // 如果沒有 results
    // 就用最新 classes 判斷
    // ===================================================

    submittedClassIds.forEach(
      function(classId) {

        const cls =
          data.classes.find(
            function(item) {

              return String(
                item.classId
              ) === String(
                classId
              );

            }
          );


        if (!cls) {

          return;

        }


        if (cls.bookedByMe) {

          html +=
            '<div class="result-success">' +
            "✅ " +
            escapeHtml(
              cls.date
            ) +
            "（" +
            escapeHtml(
              cls.weekday
            ) +
            "） " +
            escapeHtml(
              cls.time
            ) +
            "　預約成功" +
            "</div>";

        }
        else {

          html +=
            '<div class="result-failed">' +
            "❌ " +
            escapeHtml(
              cls.date
            ) +
            "（" +
            escapeHtml(
              cls.weekday
            ) +
            "） " +
            escapeHtml(
              cls.time
            ) +
            "　未預約" +
            "</div>";

        }

      }
    );

  }
  else {

    html +=
      '<div class="result-success">' +
      "✅ 預約處理完成" +
      "</div>";

  }


  result.innerHTML =
    html;

}


// =========================================================
// 顯示預約錯誤
// =========================================================

function showResultError(
  message
) {

  const result =
    document.getElementById(
      "result"
    );


  result.style.display =
    "block";


  result.innerHTML =
    '<div class="result-title">' +
    "預約失敗" +
    "</div>" +

    '<div class="result-failed">' +
    "❌ " +
    escapeHtml(
      message
    ) +
    "</div>";


  setStatus(
    "❌ 預約處理失敗"
  );

}


// =========================================================
// GAS：批次預約
// =========================================================

window.gasSubmitCallback =
  function(response) {

    console.log(
      "GAS Submit Response:",
      response
    );


    isSubmitting = false;


    const button =
      document.getElementById(
        "bookingButton"
      );


    button.disabled =
      false;


    button.textContent =
      "確定預約";


    // ===================================================
    // GAS 沒有回傳
    // ===================================================

    if (!response) {

      showResultError(
        "GAS 回傳空資料"
      );

      return;

    }


    // ===================================================
    // GAS 回傳失敗
    // ===================================================

    if (!response.success) {

      showResultError(
        response.message ||
        "預約失敗"
      );

      return;

    }


    // ===================================================
    // 很重要：
    //
    // 先複製這次選擇的日期
    //
    // 因為後面會清空 selectedClassIds
    // ===================================================

    const submittedClassIds =
      selectedClassIds.slice();


    // ===================================================
    // GAS 回傳資料
    // ===================================================

    const data =
      response.data;


    // ===================================================
    // 顯示預約結果
    // ===================================================

    showBookingResult(
      data,
      submittedClassIds
    );


    // ===================================================
    // 直接使用 GAS 回傳的最新課程
    //
    // ★ 不再呼叫 loadClasses()
    // ===================================================

    if (
      data &&
      Array.isArray(data.classes)
    ) {

      classes =
        data.classes;


      // 清除勾選

      selectedClassIds = [];


      // 重新畫面

      renderClasses();


      setStatus(
        "⑥ 預約完成\n\n" +
        "課程資料已更新"
      );

    }
    else {

      selectedClassIds = [];


      renderClasses();


      setStatus(
        "⑥ 預約完成"
      );

    }

  };


// =========================================================
// 送出批次預約
// =========================================================

function submitBookings() {

  if (isSubmitting) {

    return;

  }


  if (
    selectedClassIds.length === 0
  ) {

    alert(
      "請至少選擇一堂課程"
    );

    return;

  }


  // =====================================================
  // 保留本次選擇
  // =====================================================

  const submittedClassIds =
    selectedClassIds.slice();


  // =====================================================
  // 找出選擇的課程
  // =====================================================

  const selectedClasses =
    classes.filter(
      function(cls) {

        return submittedClassIds.includes(
          cls.classId
        );

      }
    );


  // =====================================================
  // 確認文字
  // =====================================================

  const dateText =
    selectedClasses
      .map(
        function(cls) {

          return (
            cls.date +
            "（" +
            cls.weekday +
            "） " +
            cls.time
          );

        }
      )
      .join("\n");


  const confirmed =
    confirm(
      "確定要預約以下課程嗎？\n\n" +
      dateText
    );


  if (!confirmed) {

    return;

  }


  // =====================================================
  // 開始送出
  // =====================================================

  isSubmitting = true;


  const button =
    document.getElementById(
      "bookingButton"
    );


  button.disabled =
    true;


  button.textContent =
    "預約處理中...";


  setStatus(
    "正在處理預約，請稍候..."
  );


  // =====================================================
  // 移除舊 script
  // =====================================================

  const oldScript =
    document.getElementById(
      "gas-submit-script"
    );


  if (oldScript) {

    oldScript.remove();

  }


  // =====================================================
  // 建立 JSONP script
  // =====================================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    "gas-submit-script";


  const classIdsJson =
    JSON.stringify(
      submittedClassIds
    );


  script.src =
    GAS_URL +
    "?action=submitBookings" +
    "&callback=gasSubmitCallback" +
    "&idToken=" +
    encodeURIComponent(
      idToken
    ) +
    "&selectedClassIds=" +
    encodeURIComponent(
      classIdsJson
    ) +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      isSubmitting = false;


      button.disabled =
        false;


      button.textContent =
        "確定預約";


      showResultError(
        "無法連線到 GAS"
      );

    };


  document.body.appendChild(
    script
  );

}


// =========================================================
// LIFF 初始化
// =========================================================

async function init() {

  try {

    // -----------------------------------------------------
    // ① 初始化
    // -----------------------------------------------------

    setStatus(
      "① 初始化 LIFF..."
    );


    await liff.init({

      liffId: LIFF_ID,

      withLoginOnExternalBrowser: true

    });


    // -----------------------------------------------------
    // ② 初始化成功
    // -----------------------------------------------------

    setStatus(
      "② LIFF 初始化成功"
    );


    // -----------------------------------------------------
    // ③ LINE 登入
    // -----------------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "③ 尚未登入 LINE\n\n" +
        "準備登入..."
      );


      liff.login();

      return;

    }


    setStatus(
      "③ LINE 登入成功"
    );


    // -----------------------------------------------------
    // ④ ID Token
    // -----------------------------------------------------

    idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "拿不到 LINE ID Token"
      );

    }


    console.log(
      "LINE ID Token 已取得"
    );


    // -----------------------------------------------------
    // ⑤ 取得課程
    // -----------------------------------------------------

    loadClasses();

  }
  catch (error) {

    console.error(
      error
    );


    showError(
      error.message ||
      String(error)
    );

  }

}


// =========================================================
// 按鈕事件
// =========================================================

document
  .getElementById(
    "bookingButton"
  )
  .addEventListener(
    "click",
    submitBookings
  );


// =========================================================
// 啟動
// =========================================================

init();

</script>
