<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>課程預約</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 20px;

      background: #f7f7f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color: #222;
    }


    .container {

      max-width: 600px;

      margin: 20px auto;
    }


    .header {

      background: white;

      padding: 24px;

      border-radius: 18px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);
    }


    h1 {

      margin: 0 0 8px 0;

      font-size: 30px;
    }


    .user {

      color: #666;

      font-size: 16px;
    }


    .status {

      padding: 16px;

      background: white;

      border-radius: 14px;

      margin-bottom: 16px;

      white-space: pre-wrap;

      line-height: 1.6;
    }


    .class-card {

      background: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }


    .class-date {

      font-size: 21px;

      font-weight: 700;

      margin-bottom: 6px;
    }


    .class-time {

      font-size: 17px;

      color: #555;

      margin-bottom: 10px;
    }


    .class-count {

      font-size: 16px;

      margin-bottom: 8px;
    }


    .class-names {

      font-size: 14px;

      color: #666;

      line-height: 1.6;
    }


    .available {

      color: #16803c;

      font-weight: 600;
    }


    .full {

      color: #d93025;

      font-weight: 600;
    }


    .booked {

      color: #1a73e8;

      font-weight: 600;
    }


    pre {

      background: #f1f3f4;

      padding: 14px;

      border-radius: 10px;

      overflow-x: auto;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 12px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       標題
       ===================================================== -->

  <div class="header">

    <h1>課程預約</h1>

    <div
      id="userName"
      class="user"
    >
      使用者資料載入中...
    </div>

  </div>


  <!-- =====================================================
       狀態
       ===================================================== -->

  <div
    id="status"
    class="status"
  >
    ① 初始化 LIFF...
  </div>


  <!-- =====================================================
       課程
       ===================================================== -->

  <div id="classes"></div>


</div>


<script>


// =========================================================
// 基本設定
// =========================================================

const LIFF_ID =
  "2011656647-Tw5kY4xl";


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzoDeakQtcTqIHCeJoqaTaGIpkkAsWZMk34gXu1G1m1QWWFEgPZfTsIonKSMZxu74Mu2g/exec";


// =========================================================
// UI
// =========================================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


// =========================================================
// JSONP Callback
// =========================================================

window.gasBookingCallback =
  function(response) {

    console.log(
      "GAS Booking Response:",
      response
    );


    if (!response) {

      setStatus(
        "❌ GAS 回傳空資料"
      );

      return;
    }


    if (!response.success) {

      setStatus(
        "❌ GAS 取得課程失敗\n\n" +
        response.message
      );

      return;
    }


    // =====================================================
    // 成功
    // =====================================================

    const data =
      response.data;


    if (!data) {

      setStatus(
        "❌ GAS 沒有回傳課程資料"
      );

      return;
    }


    document.getElementById(
      "userName"
    ).textContent =
      "您好，" + (data.userName || "會員");


    setStatus(
      "⑥ 課程資料取得成功"
    );


    renderClasses(
      data.classes || []
    );

  };


// =========================================================
// 顯示課程
// =========================================================

function renderClasses(classes) {

  const container =
    document.getElementById("classes");


  container.innerHTML = "";


  if (!classes.length) {

    container.innerHTML =
      '<div class="class-card">目前沒有課程</div>';

    return;
  }


  classes.forEach(function(cls) {

    const card =
      document.createElement("div");


    card.className =
      "class-card";


    // -----------------------------------------------------
    // 日期
    // -----------------------------------------------------

    const date =
      document.createElement("div");

    date.className =
      "class-date";

    date.textContent =
      cls.date + "（" + cls.weekday + "）";


    // -----------------------------------------------------
    // 時間
    // -----------------------------------------------------

    const time =
      document.createElement("div");

    time.className =
      "class-time";

    time.textContent =
      cls.time;


    // -----------------------------------------------------
    // 人數
    // -----------------------------------------------------

    const count =
      document.createElement("div");

    count.className =
      "class-count";


    count.textContent =
      "目前 " +
      cls.count +
      " / " +
      cls.maxPeople +
      " 人";


    // -----------------------------------------------------
    // 狀態
    // -----------------------------------------------------

    const status =
      document.createElement("div");


    if (cls.bookedByMe) {

      status.className =
        "booked";

      status.textContent =
        "✓ 已預約";

    }
    else if (cls.count >= cls.maxPeople) {

      status.className =
        "full";

      status.textContent =
        "● 已額滿";

    }
    else {

      status.className =
        "available";

      status.textContent =
        "○ 尚可預約";
    }


    // -----------------------------------------------------
    // 已預約名單
    // -----------------------------------------------------

    const names =
      document.createElement("div");

    names.className =
      "class-names";


    if (cls.names && cls.names.length) {

      names.textContent =
        "已預約：" +
        cls.names.join("、");

    }
    else {

      names.textContent =
        "目前尚無預約";
    }


    card.appendChild(date);

    card.appendChild(time);

    card.appendChild(count);

    card.appendChild(status);

    card.appendChild(names);


    container.appendChild(card);

  });

}


// =========================================================
// 呼叫 GAS
// =========================================================

function callGas(idToken) {

  setStatus(
    "④ 已取得 ID Token\n\n" +
    "⑤ 正在取得課程資料..."
  );


  // -------------------------------------------------------
  // 建立 script
  // -------------------------------------------------------

  const script =
    document.createElement("script");


  script.id =
    "gas-booking-script";


  // -------------------------------------------------------
  // 注意：
  // ID Token 使用 encodeURIComponent
  // -------------------------------------------------------

  script.src =
    GAS_URL +
    "?callback=gasBookingCallback" +
    "&idToken=" +
    encodeURIComponent(idToken) +
    "&_=" +
    Date.now();


  // -------------------------------------------------------
  // 載入失敗
  // -------------------------------------------------------

  script.onerror =
    function(error) {

      console.error(
        "GAS script error:",
        error
      );


      setStatus(
        "❌ GAS API 無法連線"
      );

    };


  document.body.appendChild(
    script
  );


  // -------------------------------------------------------
  // Timeout
  // -------------------------------------------------------

  setTimeout(
    function() {

      if (
        !window.__gasBookingFinished
      ) {

        console.warn(
          "GAS API 超過 15 秒"
        );

      }

    },
    15000
  );

}


// =========================================================
// LIFF 初始化
// =========================================================

async function init() {

  try {

    // -----------------------------------------------------
    // ①
    // -----------------------------------------------------

    setStatus(
      "① 初始化 LIFF..."
    );


    await liff.init({

      liffId: LIFF_ID,

      withLoginOnExternalBrowser: true

    });


    // -----------------------------------------------------
    // ②
    // -----------------------------------------------------

    setStatus(
      "② LIFF 初始化成功"
    );


    // -----------------------------------------------------
    // ③
    // -----------------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "③ 尚未登入 LINE\n\n" +
        "準備登入..."
      );


      liff.login();

      return;
    }


    setStatus(
      "③ LINE 登入成功"
    );


    // -----------------------------------------------------
    // ④
    // -----------------------------------------------------

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "拿不到 LINE ID Token"
      );

    }


    console.log(
      "LINE ID Token 已取得"
    );


    // -----------------------------------------------------
    // ⑤
    // -----------------------------------------------------

    callGas(idToken);

  }
  catch (error) {

    console.error(error);


    setStatus(
      "❌ 發生錯誤\n\n" +
      error.message
    );

  }

}


// =========================================================
// 開始
// =========================================================

init();


</script>


</body>

</html>
